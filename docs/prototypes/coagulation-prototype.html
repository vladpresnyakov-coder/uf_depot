// Диапазон расхода: «только коагуляция» — Qном задаёт пользователь, Qmin/Qmax опционально (пусто = Qном);
// «с установками УФ» — по умолчанию Qmin = 1 рабочая установка, Qном = все рабочие установки; оба значения можно переопределить.
function effQ(st){const q=st.Q;
 if(q.mode==="uf"){const one=q.qTrain, all=(isNum(q.qTrain)&&isNum(q.nTrains))?q.qTrain*q.nTrains:NaN;
  const min=isNum(q.minUser)?q.minUser:one, nom=all, max=isNum(q.maxUser)?q.maxUser:all;
  return {min,nom,max,src:{min:isNum(q.minUser)?"user":"1 уст.",max:isNum(q.maxUser)?"user":"= Qном"}};}
 const nom=q.nom; return {min:isNum(q.min)?q.min:nom,nom,max:isNum(q.max)?q.max:nom,src:{min:isNum(q.min)?"user":"= Qном",max:isNum(q.max)?"user":"= Qном"}};}
function compute(st){
 const W=[],ASM=[],out={W,ASM}; const r=st.r, R=REAG[r], P=st.pp[r];
 const Q=effQ(st); out.Q=Q; out.qOk=isNum(Q.min)&&isNum(Q.nom)&&isNum(Q.max)&&Q.min>0&&Q.min<=Q.nom&&Q.nom<=Q.max;
 if(!out.qOk) W.push(["bad","Расходы: нужно Qmin ≤ Qnom ≤ Qmax, все > 0."]);
 if(st.Q.mode==="uf"&&out.qOk&&st.Q.nTrains>1) W.push(["warn","Работа одной установки УФ ("+fmt(Q.min)+" м³/ч): насос-дозатор должен обеспечивать равномерный впрыск при минимальной подаче; проверить смешение и скорость в трубопроводе при этом расходе."]);
 // паспорт
 let wProd=NaN; if(isNum(P.c)&&P.c>0&&P.cb){ wProd=P.c/100*(P.cb==="product"?NaN:wMe(r,P.cb,P.hn)); }
 out.pass={ok:isFinite(wProd)&&wProd>0,wProd};
 if(!out.pass.ok) W.push(["bad","Паспорт продукта: укажите концентрацию и её базу. Без базы концентрация не принимается."]);
 if(out.pass.ok&&P.c>100) W.push(["bad","Концентрация > 100 % масс."]);
 if(P.form==="liquid"&&!isNum(P.rho)) W.push(["warn","Нет плотности товарного раствора — л/ч товарного продукта не рассчитываются."]);
 if(P.form==="liquid"&&isNum(P.rho)&&(P.rho<0.8||P.rho>2)) W.push(["warn","Плотность вне 0,8–2,0 кг/л — проверьте паспорт."]);
 // дозы
 const D=st.dose; const toMe=x=>{ if(!isNum(x))return NaN; if(D.basis==="product")return x*wProd; return x*wMe(r,D.basis,D.hn);};
 out.dMe={min:toMe(D.min),nom:toMe(D.nom),max:toMe(D.max)};
 out.doseOk=st.mode==="manual"?(isFinite(out.dMe.min)&&isFinite(out.dMe.nom)&&isFinite(out.dMe.max)):false;
 if(st.mode==="manual"&&out.doseOk&&!(out.dMe.min<=out.dMe.nom&&out.dMe.nom<=out.dMe.max)) W.push(["bad","Дозы: нужно Dmin ≤ Dnom ≤ Dmax."]);
 if(st.mode==="prelim"){ if(r==="pacl"&&st.prelimStub){ out.prelim="stub"; } else out.prelim="nodata"; }
 const dStatus= st.mode==="manual"?(out.doseOk?"user":"incomplete"):(out.prelim==="stub"?"prelim":"nodata");
 out.dStatus=dStatus;
 // пересчёт дозы по базам (Dnom)
 const bases=R.bases.map(b=>b==="hydrate"?{b,hn:(D.basis==="hydrate"?D.hn:(r==="feso4"?7:(r==="alsulf"?18:(r==="fecl3"?6:9))))}:{b});
 out.doseTable=bases.map(x=>{const w=x.b==="product"?wProd:wMe(r,x.b,x.hn);return {name:basisName(r,x.b,x.hn),min:out.dMe.min/w,nom:out.dMe.nom/w,max:out.dMe.max/w};});
 // расходы
 const wc=P.wc, wcb=P.wcb; let cWorkMe=NaN; if(isNum(wc)&&wc>0){cWorkMe = wcb==="product"? wc*wProd : wc*wMe(r,wcb,P.hn);}
 const flow=(dMe,q)=>{const Mme=dMe*q/1000, Dp=dMe/wProd, Mp=Dp*q/1000;
  return {Mme,Dp,Mp,Lp:(P.form==="liquid"&&isNum(P.rho))?Mp/P.rho:NaN,Lw:isFinite(cWorkMe)?dMe*q/cWorkMe:NaN};};
 out.flows=["min","nom","max"].map(k=>({k,q:Q[k],...flow(out.dMe.nom,Q[k])}));
 out.pumpC={qmin:flow(out.dMe.min,Q.min).Lw,qnom:flow(out.dMe.nom,Q.nom).Lw,qmax:flow(out.dMe.max,Q.max).Lw};
 if(!isFinite(cWorkMe)) W.push(["warn","Не задана концентрация рабочего раствора с базой — подача насоса коагулянта не рассчитывается."]);
 if(r==="pacl") ASM.push("Для ПОХА расход показан отдельно по Al, Al₂O₃ и товарному продукту; поле «100 % ПОХА» не используется.");
 // щёлочность (стехиометрия)
 const eqPerMg = R.me==="Al"? 3/A.Al : (R.ox==="Fe(III)"? 3/A.Fe : 2/A.Fe);
 let alkF=eqPerMg; if(r==="pacl"){ if(isNum(P.basicity)&&P.bdef){alkF=eqPerMg*(1-P.basicity/100);} else alkF=NaN; }
 out.alk={f:alkF,cons:out.dMe.nom*alkF,cmax:out.dMe.max*alkF,water:st.water.alk};
 if(r==="pacl"&&!isFinite(alkF)) W.push(["warn","Для баланса щёлочности ПОХА нужны основность и её определение."]);
 if(isFinite(out.alk.cmax)&&isNum(st.water.alk)&&out.alk.cmax>st.water.alk) W.push(["warn","Теоретический расход щёлочности при Dmax превышает щёлочность исходной воды — требуется уточнение режима (стехиометрическая оценка, не прогноз pH)."]);
 if(!isNum(P.freeAcid)) ASM.push("Свободная кислотность продукта не задана и не учтена в балансе щёлочности.");
 ASM.push("Баланс щёлочности: принят полный гидролиз до M(OH)₃ (допущение M-06); pH по нему не прогнозируется.");
 // FeSO4
 if(r==="feso4"){ const w=st.water; const miss=[];
  if(!isNum(w.o2)&&w.oxid==="none") miss.push("растворённый кислород или окислитель");
  if(!isNum(w.ph)) miss.push("pH"); if(!isNum(w.T)) miss.push("температура"); if(!isNum(st.mix.t)&&!isNum(st.mix.V)) miss.push("контактное время");
  let fs; if(st.fe.status==="user") fs="user"; else if(miss.length) fs="nodata"; else fs="clarify";
  out.feso4={status:fs,miss,o2need:out.dMe.max*A.O*2/(4*A.Fe)};
  if(isNum(w.o2)&&isFinite(out.feso4.o2need)&&out.feso4.o2need>w.o2) W.push(["warn","Стехиометрическая потребность в O₂ при Dmax ("+fmt(out.feso4.o2need)+" мг/л) больше растворённого O₂ ("+fmt(w.o2)+" мг/л)."]);
  W.push(["bad","FeSO₄ (железо II): завершённость окисления Fe²⁺ → Fe³⁺ расчётом не подтверждена; проверенная модель не подключена. Безусловная рекомендация применения не выдаётся."]);
 }
 // pH-коррекция
 const ph=st.ph; out.ph={mode:ph.mode};
 if(ph.mode==="acid"||ph.mode==="base"){ let d=NaN, src="";
  if(ph.how==="manual"){ d=ph.d100; src="user"; }
  else { const c=[...ph.curve].filter(p=>isNum(p[0])&&isNum(p[1])).sort((a,b)=>a[1]-b[1]); const tg=ph.target;
   if(isNum(tg)&&c.length>=2&&tg>=c[0][1]&&tg<=c[c.length-1][1]){ for(let i=1;i<c.length;i++){ if(tg<=c[i][1]){const[a,b]=[c[i-1],c[i]]; d=a[0]+(tg-a[1])*(b[0]-a[0])/(b[1]-a[1]); break;} } src="curve"; }
   else { src="out"; W.push(["warn","Целевой pH вне диапазона титрационной кривой — доза не определяется (экстраполяция запрещена)."]); } }
  const qs=["min","nom","max"].map(k=>{const M100=d*Q[k]/1000, Mc=M100/(ph.w/100), Lc=isNum(ph.rho)?Mc/ph.rho:NaN, Lw=isNum(ph.wc)?d*Q[k]/ph.wc:NaN; return {k,q:Q[k],M100,Mc,Lc,Lw};});
  out.ph={mode:ph.mode,d,src,qs,ok:isFinite(d)};
  if(!isFinite(d)) W.push(["warn","Доза "+(ph.mode==="acid"?"кислоты":"щёлочи")+" не задана: точный расход по разности pH не рассчитывается — нужна ручная доза или титрационная зависимость."]);
 } else if(ph.mode==="unknown"){ W.push(["warn","Необходимость коррекции pH не определена: недостаточно данных."]); }
 // контактные камеры
 const m=st.mix, qd=Q[m.qBasis]; let Ve=NaN,t=NaN;
 if(m.calc==="t2v"){ if(isNum(m.t)&&isNum(qd)){Ve=qd*m.t/3600;} } else { if(isNum(m.V)){Ve=m.V;} }
 const k=(m.useK&&isNum(m.k)&&m.k>0&&m.k<=1)?m.k:null;
 if(m.useK&&!k) W.push(["bad","Коэффициент k должен быть в (0; 1]."]);
 if(m.useK&&k&&!m.kBasis) W.push(["warn","Для k не указано основание — применён как допущение пользователя."]);
 const Vg=k?Ve/k:Ve;
 out.ch={qd,Ve,Vg,k,times:["min","nom","max"].map(x=>({k:x,q:Q[x],t:isFinite(Ve)?3600*Ve/Q[x]:NaN}))};
 if(!m.tBasis||/ДЕМО/.test(m.tBasis)) W.push(["warn","Контактное время не обосновано. Объём рассчитан по заданному времени; технологическая достаточность не подтверждена."]);
 ASM.push("Камеры: 1 рабочая + 1 резервная, каждая на 100 % расчётного расхода; резервная не входит в контактный объём (Р7).");
 if(!k) ASM.push("Коэффициент использования объёма k не применяется: Vгеом = Vэфф.");
 // труба
 const pp=st.pipe, qp=Q[pp.qBasis]; const dCalc=(isNum(qp)&&isNum(pp.v)&&pp.v>0)?Math.sqrt(4*(qp/3600)/(Math.PI*pp.v))*1000:NaN;
 const vAt=q=>isNum(pp.din)&&pp.din>0?4*(q/3600)/(Math.PI*(pp.din/1000)**2):NaN;
 out.pipe={qp,dCalc,vs:["min","nom","max"].map(x=>({k:x,q:Q[x],v:vAt(Q[x])}))};
 if(!isNum(pp.din)) W.push(["warn","Стандартный типоразмер не выбран: показан расчётный внутренний диаметр; нужен каталог трубы."]);
 ASM.push("Потери давления в трубопроводе не рассчитываются (полный гидравлический расчёт вне v1).");
 // насосы
 const pu=st.pump; const pReq=(isNum(pu.p)?pu.p:NaN)+(isNum(pu.dp)?pu.dp:0);
 const mk=(o)=>{const top=isNum(pu.margin)?o.qmax*(1+pu.margin/100):NaN; return {...o,top,turn:o.qmax/o.qmin,p:pReq};};
 out.pumps=[{tag:"P-101A/B",name:"Насос-дозатор коагулянта",...mk(out.pumpC),mat:R.me==="Fe"?"Хлорид/сульфат железа: проточная часть из стойких к кислым растворам материалов (уточнить по паспорту)":"Проточная часть, стойкая к ПОХА / сульфату Al (уточнить по паспорту)"}];
 if(out.ph.ok){ const d=out.ph.d; const Lw=q=>isNum(ph.wc)?d*q/ph.wc:NaN; out.pumps.push({tag:"P-102A/B",name:"Насос-дозатор "+(ph.mode==="acid"?"кислоты ("+ph.reag+")":"щёлочи ("+ph.reag+")"),...mk({qmin:Lw(Q.min),qnom:Lw(Q.nom),qmax:Lw(Q.max)}),mat:"Уточнить по реагенту "+ph.reag}); }
 if(!isNum(pu.margin)) W.push(["warn","Проектный запас насосов не задан — верх рекомендуемого диапазона не определён."]);
 // статус результата
 const hasBad=W.some(w=>w[0]==="bad");
 out.status= !out.qOk||!out.pass.ok? "incomplete" : (dStatus==="nodata"?"nodata": dStatus==="incomplete"?"incomplete": (r==="feso4"||W.length? "clarify" : dStatus));
 if(dStatus==="prelim"&&out.status!=="incomplete") out.status="prelim";
 out.hasBad=hasBad; return out;
}
const STATUS={user:["s-user","Задано пользователем"],prelim:["s-prelim","Предварительная оценка"],clarify:["s-clarify","Требуется уточнение"],incomplete:["s-incomplete","Расчёт не завершён"],nodata:["s-nodata","Недостаточно данных"],balance:["s-balance","Материальный баланс"]};
const pill=s=>`<span class="pill ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
function fmt(x,sig=3){ if(!isNum(x))return "—"; const a=Math.abs(x); const d=a===0?0:(a>=100?1:a>=10?2:a>=1?2:a>=0.1?3:4); return x.toLocaleString(LANG==="ru"?"ru-RU":LANG==="zh"?"zh-CN":"en-US",{maximumFractionDigits:d,minimumFractionDigits:0}); }
const QL={min:"Qmin",nom:"Qnom",max:"Qmax"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ Поля ============ */
function getP(p){return p.split(".").reduce((o,k)=>o?.[k],S);}
function setP(p,v){const ks=p.split("."),last=ks.pop();const o=ks.reduce((o,k)=>o[k],S);o[last]=v;}
function num(p,label,u,o={}){const v=getP(p);const miss=o.req&&!isNum(v);
 return `<div class="f${miss?" missing":""}"><label for="${p}">${label}${o.req?' <span class="req">*</span>':""}</label><div class="row"><input id="${p}" class="num" inputmode="decimal" data-k="${p}" data-t="num" value="${isNum(v)?String(v).replace(".",","):""}" placeholder="${o.ph||"нет данных"}">${u?`<span class="u">${u}</span>`:""}</div>${o.hint?`<div class="hint">${o.hint}</div>`:""}</div>`;}
function txt(p,label,o={}){const v=getP(p);return `<div class="f"><label for="${p}">${label}${o.req?' <span class="req">*</span>':""}</label><input id="${p}" data-k="${p}" data-t="txt" value="${esc(v)}" placeholder="${o.ph||""}">${o.hint?`<div class="hint">${o.hint}</div>`:""}</div>`;}
function sel(p,label,opts,o={}){const v=getP(p);return `<div class="f"><label for="${p}">${label}${o.req?' <span class="req">*</span>':""}</label><select id="${p}" data-k="${p}" data-t="${o.t||"txt"}" data-full="1">${opts.map(([k,l])=>`<option value="${k}"${String(k)===String(v)?" selected":""}>${l}</option>`).join("")}</select>${o.hint?`<div class="hint">${o.hint}</div>`:""}</div>`;}
function seg(p,opts){const v=getP(p);return `<div class="seg" role="radiogroup">${opts.map(([k,l])=>`<label><input type="radio" name="${p}" data-k="${p}" data-t="txt" data-full="1" value="${k}"${k===v?" checked":""}>${l}</label>`).join("")}</div>`;}
const live=(name)=>`<div data-live="${name}">${LIVE[name]()}</div>`;
function msgs(list){return list.map(([c,m])=>`<div class="msg ${c}">${m}</div>`).join("");}

V.project=()=>`
<h1>Проект и структура</h1><p class="lead">Несколько источников воды и линий в одном проекте. Требования к качеству задаются здесь.</p>
<div class="grid2">
 <div class="stack"><div class="panel"><h2>Сведения</h2><div class="fields">${txt("project.name","Название проекта",{req:1})}${txt("project.customer","Заказчик / объект")}</div><div class="fields" style="margin-top:12px">${txt("project.desc","Описание")}</div></div>
 <div class="panel"><h2>Требования к качеству</h2>
  <div class="tw"><table><thead><tr><th>Показатель</th><th class="n">Значение</th><th>Контрольная точка</th><th>Тип пробы</th><th>Статус</th></tr></thead><tbody>
  ${S.req.map(q=>`<tr><td>${q.p}</td><td class="n">≤ ${fmt(q.v)} ${q.u}</td><td>${q.pt}</td><td class="small">${q.type}</td><td><span class="pill s-clarify">Не подтверждено</span></td></tr>`).join("")}</tbody></table></div>
  <div class="msg warn">Требование задано. Достижение расчётом не подтверждено; требуется проверка.</div>
  <p class="footnote">Металл в лабораторно отфильтрованной пробе перед УФ и металл в ультрафильтрате — разные контрольные точки и не смешиваются.</p></div></div>
 <div class="panel"><h2>Структура</h2><ul class="tree">
  <li><b>${esc(S.project.name)}</b><ul>
   <li>Источник воды: Поверхностный водозабор (демо)<ul><li>Анализ ${esc(S.water.id)} · ${S.water.date}</li></ul></li>
   <li>Линия 1 · Q ${fmt(C.Q.min)}/${fmt(C.Q.nom)}/${fmt(C.Q.max)} м³/ч<ul>
    <li>Узел коагуляции · ${REAG[S.r].short}</li>
    <li>Установка УФ <span class="muted small">— хранение данных для будущих инструментов</span></li>
    <li>Расчёты: ${S.versions.map(v=>`<a href="#results" onclick="S.selVersion=${v.n}">в.${v.n}</a>`).join(", ")||"нет версий"}</li></ul></li>
   <li class="muted">+ Добавить источник · + Добавить линию</li></ul></li></ul>
  <div class="btns"><a class="btn" href="#water">Новый расчёт на линии 1</a></div></div>
</div>`;

function stepsBar(cur){const st={water:C.qOk?"ok":"er",coag:C.pass.ok?(S.r==="feso4"?"wn":"ok"):"er",dose:C.dStatus==="user"||C.dStatus==="prelim"?"ok":"er",ph:C.ph.mode==="none"||C.ph.ok?"ok":"wn",contact:isFinite(C.ch.Ve)?"wn":"er",pipe:isFinite(C.pipe.dCalc)?(isNum(S.pipe.din)&&isNum(S.pump.margin)?"ok":"wn"):"er"};
 return `<ol class="steps">${WIZ.map((w,i)=>`<li><a href="#${w}"${w===cur?' aria-current="step"':""}><span class="dot ${st[w]}"></span>${i+1}. ${t(w)}</a></li>`).join("")}<li><a href="#results">→ ${t("results")}</a></li></ol>`;}
function wizNav(cur){const i=WIZ.indexOf(cur);return `<div class="btns">${i>0?`<a class="btn ghost" href="#${WIZ[i-1]}">← Назад</a>`:""}<a class="btn" href="#${WIZ[i+1]||"results"}">${WIZ[i+1]?"Далее →":"Рассчитать →"}</a><button class="btn ghost" type="button" onclick="saveVersion()">Сохранить версию</button></div>`;}

V.water=()=>`${stepsBar("water")}
<h1>Исходная вода и расходы</h1><p class="lead">Показатели отмечаются как используемые в проекте. Пустое поле означает «нет данных», а не ноль.</p>
<div class="grid2"><div class="stack">
 <div class="panel"><h2>Расход исходной воды</h2>${seg("Q.mode",[["coag","Только коагуляция"],["uf","С установками УФ"]])}
  ${S.Q.mode==="coag"?`<div class="fields" style="margin-top:12px">${num("Q.nom","Qном","м³/ч",{req:1,hint:"задаётся пользователем"})}${num("Q.min","Qmin","м³/ч",{ph:"= Qном",hint:"опционально"})}${num("Q.max","Qmax","м³/ч",{ph:"= Qном",hint:"опционально"})}</div>`:
  `<div class="fields" style="margin-top:12px">${num("Q.nTrains","Рабочих установок УФ","шт.",{req:1})}${num("Q.qTrain","Подача исходной воды на одну установку","м³/ч",{req:1,hint:"подача на УФ, а не фильтрат; из расчёта УФ"})}</div>
  <details${isNum(S.Q.minUser)||isNum(S.Q.maxUser)?" open":""}><summary>Изменить диапазон вручную</summary><div class="fields" style="margin-top:8px">${num("Q.minUser","Qmin","м³/ч",{ph:"1 установка"})}${num("Q.maxUser","Qmax","м³/ч",{ph:"= Qном"})}</div></details>`}
  ${live("qchk")}</div>
 <div class="panel"><h2>Анализ</h2><div class="fields">${txt("water.id","Идентификатор анализа")}${txt("water.date","Дата отбора",{ph:"ГГГГ-ММ-ДД"})}</div>
  <div class="fields" style="margin-top:12px">${num("water.ph","pH","",{hint:"нужно для баланса и FeSO₄"})}${num("water.alk","Общая щёлочность","мг-экв/л",{hint:"= ммоль/л HCO₃⁻; мг/л CaCO₃ ÷ 50,04"})}${num("water.T","Температура","°C")}${num("water.turb","Мутность","NTU")}${num("water.color","Цветность","град.")}${num("water.po","Перманганатная окисляемость","мг O₂/л")}${num("water.tss","Взвешенные вещества","мг/л")}${num("water.al","Al общий","мг/л")}${num("water.fe","Fe общее","мг/л")}</div>
  <details><summary>Дополнительно по каждому показателю</summary><p class="small muted">Для каждого значения: точка отбора, метод анализа, признак «ниже предела определения» и сам предел. В прототипе показано на примере:</p>
   <div class="fields"><div class="f"><label for="xlod">Al общий: ниже предела определения</label><select id="xlod"><option>нет</option><option>да</option></select></div><div class="f"><label for="xlodv">Предел определения</label><div class="row"><input id="xlodv" class="num" placeholder="нет данных"><span class="u">мг/л</span></div></div><div class="f"><label for="xmet">Метод</label><input id="xmet" placeholder="напр., ИСП-ОЭС"></div></div></details>
  ${S.r==="feso4"?`<div class="calc" style="margin-top:16px"><h3>Блок FeSO₄ (железо II) — появляется для этого реагента</h3><div class="fields">${num("water.o2","Растворённый кислород","мг/л")}${num("water.fe2","Fe²⁺","мг/л")}${sel("water.aer","Аэрация",[["no","нет"],["yes","есть"]])}${sel("water.oxid","Окислитель",[["none","не используется"],["NaOCl","гипохлорит натрия"],["KMnO4","перманганат калия"],["other","другой"]])}${num("water.oxTime","Доступное время окисления","с")}</div></div>`:""}
 </div></div>
 <div class="stack"><div class="panel"><h2>Импорт Excel / CSV</h2>
  <ol class="small" style="padding-left:18px;margin:0 0 10px;display:grid;gap:4px"><li>Скачать шаблон (колонки: показатель, значение, единица, точка, дата, метод, &lt;ПО, ПО).</li><li>Загрузить файл.</li><li>Сопоставить колонки и единицы.</li><li>Проверить предпросмотр и ошибки по строкам.</li><li>Подтвердить: создаётся новый анализ.</li></ol>
  <div class="tw"><table><thead><tr><th>Строка</th><th>Показатель</th><th class="n">Значение</th><th>Единица</th><th>Проверка</th></tr></thead><tbody>
   <tr><td class="n">2</td><td>pH</td><td class="n">7,4</td><td>—</td><td><span class="pill s-balance">OK</span></td></tr>
   <tr><td class="n">3</td><td>Щёлочность</td><td class="n">105</td><td>мг/л CaCO₃</td><td><span class="pill s-balance">→ 2,10 мг-экв/л</span></td></tr>
   <tr><td class="n">4</td><td>Мутность</td><td class="n">шесть</td><td>NTU</td><td><span class="pill s-nodata">Не число</span></td></tr>
   <tr><td class="n">5</td><td>Цветность</td><td class="n">35</td><td>°?</td><td><span class="pill s-clarify">Единица не распознана</span></td></tr></tbody></table></div>
  <div class="msg info small">Существующий анализ не заменяется без явной кнопки «Заменить» и подтверждения.</div>
  <div class="btns"><button class="btn ghost" type="button" disabled>Создать новый анализ (2 ошибки)</button></div><p class="footnote">Пример предпросмотра — демонстрационный.</p></div></div>
</div>${wizNav("water")}`;
LIVE.qchk=()=>{const q=C.Q;if(!C.qOk)return msgs([["bad","Нужно Qmin ≤ Qном ≤ Qmax, все значения больше нуля."]]);
 return `<div class="calc" style="margin-top:14px"><h3>Расчётный диапазон</h3><dl class="kv"><dt>Qmin (${q.src.min})</dt><dd>${fmt(q.min)} м³/ч</dd><dt>Qном${S.Q.mode==="uf"?" ("+S.Q.nTrains+" уст.)":""}</dt><dd>${fmt(q.nom)} м³/ч</dd><dt>Qmax (${q.src.max})</dt><dd>${fmt(q.max)} м³/ч</dd><dt>Отношение Qmax/Qmin</dt><dd>1:${fmt(q.max/q.min,2)}</dd></dl>
 <p class="footnote">${S.Q.mode==="uf"?"Насос-дозатор подбирается на равномерный впрыск при работе одной установки (Qmin). ":""}Камеры и труба по умолчанию подбираются по Qmax.</p></div>`;};

V.coag=()=>{const r=S.r,R=REAG[r],p="pp."+r,P=S.pp[r];
 const cbOpts=[["metal",R.me],...(R.me==="Al"?[["Al2O3","Al₂O₃"]]:[]),...(R.salt?[["salt",R.salt.f+" безводный"],["hydrate",R.salt.f+"·nH₂O (кристаллогидрат)"]]:[])];
 return `${stepsBar("coag")}
<h1>Коагулянт и паспорт продукта</h1><p class="lead">Концентрация без указания базы не принимается. Паспорт копируется в версию расчёта; изменение справочника не меняет сохранённые версии.</p>
<div class="panel" style="margin-bottom:20px"><h2>Тип коагулянта</h2>${seg("r",Object.entries(REAG).map(([k,v])=>[k,`${v.short} <span class="small" style="opacity:.75">${v.ox}</span>`]))}
 <p class="footnote">Степень окисления железа указана всегда: Fe₂(SO₄)₃ — железо(III), FeSO₄ — железо(II).${r==="alsulf"||r==="fe2so4"?" Для этого реагента в демо паспорт не заполнен — так выглядит незавершённый расчёт.":""}</p></div>
<div class="grid2"><div class="panel"><h2>Паспорт: ${R.label}</h2>
 <div class="fields">${txt(p+".name","Название",{req:1})}${txt(p+".maker","Производитель")}${txt(p+".grade","Марка")}${txt(p+".batch","Партия",{ph:"опционально"})}
 ${sel(p+".form","Форма",[["liquid","жидкость"],["solid","твёрдый"]],{req:1})}${R.salt?sel(p+".hydr","Безводная соль / кристаллогидрат",[["anhydrous","безводная"],["hydrate","кристаллогидрат"]]):""}${R.salt&&P.hydr==="hydrate"?num(p+".hn","n в ·nH₂O","",{req:1}):""}</div>
 <div class="calc" style="margin-top:14px"><h3>Концентрация товарного продукта</h3><div class="fields">${num(p+".c","Концентрация","% масс.",{req:1})}${sel(p+".cb","База выражения",cbOpts,{req:1})}${P.form==="liquid"?num(p+".rho","Плотность товарного раствора","кг/л",{req:1}):""}</div>${live("pass")}</div>
 ${r==="pacl"?`<div class="calc" style="margin-top:14px"><h3>ПОХА</h3><div class="fields">${num(p+".basicity","Основность","%")}${txt(p+".bdef","Определение основности",{hint:"предложение Р11: [OH]/(3·[Al]), мольн. %"})}${num(p+".freeAcid","Свободная кислотность","мг-экв/г",{hint:"если известна"})}</div></div>`:""}
 ${R.me==="Fe"?`<details${r==="feso4"?" open":""}><summary>Fe²⁺ / Fe³⁺ в продукте</summary><div class="fields">${num(p+".fe2","Доля Fe²⁺ от Fe общ.","%",{hint:"если указана в паспорте"})}</div></details>`:""}
 </div>
 <div class="panel"><h2>Рабочий раствор</h2><div class="fields">${txt(p+".wPrep","Способ приготовления")}${num(p+".wc","Концентрация рабочего раствора","г/л")}${sel(p+".wcb","База",[...cbOpts,["product","товарный продукт"]])}</div>
 ${live("work")}
 ${r==="feso4"?`<div class="msg bad"><b>FeSO₄ — железо(II).</b> Не эквивалентен FeCl₃ по содержанию Fe: для коагуляции требуется окисление Fe²⁺ → Fe³⁺. Состояние окисления задаётся на шаге «Режим дозирования».</div>`:""}
 <div class="btns"><button class="btn ghost" type="button">Сохранить в мой справочник</button></div></div></div>${wizNav("coag")}`;};
LIVE.pass=()=>{const P=S.pp[S.r];if(!C.pass.ok)return msgs([["bad","Укажите концентрацию и базу. Без базы значение не принимается."]]);
 return `<dl class="kv" style="margin-top:10px"><dt>Массовая доля ${REAG[S.r].me} в товарном продукте</dt><dd>${fmt(C.pass.wProd*100,4)} %</dd>${S.r==="pacl"?`<dt>Массовая доля Al₂O₃</dt><dd>${fmt(C.pass.wProd/wMe("pacl","Al2O3")*100,4)} %</dd>`:""}</dl><p class="footnote">Пересчёт по стехиометрии (M-01). ${P.cb==="hydrate"?"Кристаллогидрат n = "+P.hn+".":""}</p>`;};
LIVE.work=()=>{const P=S.pp[S.r];if(!isNum(P.wc))return msgs([["warn","Концентрация рабочего раствора не задана — подача насоса не рассчитывается."]]);
 const cMe=P.wcb==="product"?P.wc*C.pass.wProd:P.wc*wMe(S.r,P.wcb,P.hn);return `<dl class="kv" style="margin-top:10px"><dt>То же по ${REAG[S.r].me}</dt><dd>${fmt(cMe)} г/л</dd></dl><p class="footnote">При расчёте подачи числитель и знаменатель приводятся к одной базе (M-05).</p>`;};

V.dose=()=>{const r=S.r,R=REAG[r];const bopts=R.bases.map(b=>[b,b==="hydrate"?R.salt.f+"·nH₂O":basisName(r,b)]);
 return `${stepsBar("dose")}
<h1>Режим дозирования</h1><p class="lead">«Оптимальная доза» не выдаётся: подтверждённой модели нет. Предварительная оценка возможна только при зарегистрированной методике.</p>
<div class="panel" style="margin-bottom:20px">${seg("mode",[["manual","Заданная доза"],["prelim","Предварительная оценка"]])}</div>
<div class="grid2"><div class="stack">
 ${S.mode==="manual"?`<div class="panel"><h2>Заданная доза — ${R.short}</h2><div class="fields">${sel("dose.basis","База дозы",bopts,{req:1})}${S.dose.basis==="hydrate"?num("dose.hn","n в ·nH₂O","",{req:1}):""}</div>
  <div class="fields" style="margin-top:12px">${num("dose.min","Dmin","мг/л",{req:1})}${num("dose.nom","Dnom (расчётная)","мг/л",{req:1})}${num("dose.max","Dmax","мг/л",{req:1})}</div>
  <p class="footnote">мг/л = г/м³. Внутренняя база — мг/л ${R.me}.</p></div>`:prelimPanel()}
 ${r==="feso4"?fePanel():""}</div>
 <div class="calc">${live("doseconv")}</div></div>${wizNav("dose")}`;};
function prelimPanel(){const r=S.r,R=REAG[r];
 if(r==="pacl") return `<div class="panel"><h2>Предварительная оценка — ${R.short}</h2>
  <label class="small" style="display:flex;gap:6px;align-items:center;margin-bottom:10px"><input type="checkbox" id="stub" data-k="prelimStub" data-t="bool" data-full="1"${S.prelimStub?" checked":""}> Показать интерфейс с методикой-заглушкой</label>
  ${S.prelimStub?`<div class="stub"><div class="eyebrow" style="color:var(--demo)">Заглушка интерфейса — не расчёт</div>
   <dl class="kv"><dt>Методика</dt><dd>M-14 (не зарегистрирована)</dd><dt>Источник</dt><dd>отсутствует</dd><dt>Область применимости</dt><dd>не задана</dd><dt>Версия</dt><dd>—</dd><dt>Статус верификации</dt><dd>заглушка</dd></dl>
   <p class="small" style="margin:10px 0 4px">Так будет показан диапазон после регистрации методики:</p>
   <div style="font:500 22px var(--f-mono)">X₁ … X₂ <span class="basis">мг/л Al</span></div>
   <p class="small muted" style="margin:6px 0 0">Значения не показываются, пока нет источника. Пользователь выбирает расчётную дозу внутри диапазона; выбор вне диапазона даёт предупреждение. Статус результата — «Предварительная оценка», не оптимум.</p></div>
   <div class="msg info small">Для продолжения расчёта оборудования переключитесь на «Заданная доза» — введённые данные сохраняются.</div>`:msgs([["bad","<b>Недостаточно данных.</b> Для ПОХА не зарегистрирована методика предварительной оценки. Используйте режим «Заданная доза»."]])}</div>`;
 return `<div class="panel"><h2>Предварительная оценка — ${R.short}</h2>${msgs([["bad",`<b>Недостаточно данных.</b> Для ${R.label} не зарегистрирована методика предварительной оценки. Зависимость для алюминиевых коагулянтов не переносится на соли железа. Используйте режим «Заданная доза».`]])}<button class="btn ghost" type="button" onclick="S.mode='manual';rerender()">Перейти к заданной дозе</button></div>`;}
function fePanel(){const f=C.feso4;return `<div class="panel"><h2>Окисление Fe²⁺ — FeSO₄ (железо II)</h2>
 <div class="fields">${sel("fe.status","Состояние окисления",[["auto","Определить по наличию данных"],["user","Задано пользователем"]])}${S.fe.status==="user"?txt("fe.userBasis","Основание (обязательно)",{req:1}):""}</div>
 <div style="margin:12px 0">${pill(f.status==="user"?"user":f.status)} ${f.status==="clarify"?'<span class="small">окисление: требуется проверка</span>':""}</div>
 ${f.miss.length?msgs([["warn","Не хватает: "+f.miss.join(", ")+"."]]):""}
 <dl class="kv"><dt>Стехиом. потребность O₂ при Dmax</dt><dd>${fmt(f.o2need)} мг/л</dd><dt>Растворённый O₂ в воде</dt><dd>${fmt(S.water.o2)} мг/л</dd></dl>
 <div class="msg bad small">Проверенная кинетическая модель не подключена. Состояние «окисление подтверждено принятой методикой» недоступно до регистрации методики (M-17).</div></div>`;}
LIVE.doseconv=()=>{if(S.mode!=="manual")return `<h3>Пересчёт дозы</h3><p class="small muted">Пересчёт появится после выбора расчётной дозы.</p>`;
 if(!C.doseOk||!C.pass.ok)return `<h3>Пересчёт дозы по базам</h3>${msgs([["bad","Нужны Dmin, Dnom, Dmax с базой и заполненный паспорт продукта."]])}`;
 return `<h3>Пересчёт дозы по базам · ${pill("user")}</h3><div class="tw"><table><thead><tr><th>База</th><th class="n">Dmin</th><th class="n">Dnom</th><th class="n">Dmax</th></tr></thead><tbody>
 ${C.doseTable.map(d=>`<tr><td><span class="basis">мг/л ${d.name}</span></td><td class="n">${fmt(d.min)}</td><td class="n">${fmt(d.nom)}</td><td class="n">${fmt(d.max)}</td></tr>`).join("")}</tbody></table></div>
 <div class="formula">D_product = D_${REAG[S.r].me} / w_${REAG[S.r].me},product = ${fmt(C.dMe.nom)} / ${fmt(C.pass.wProd,4)}</div>
 <h3 style="margin-top:14px">Теоретический расход щёлочности · стехиометрия</h3>
 <dl class="kv"><dt>При Dnom</dt><dd>${fmt(C.alk.cons)} мг-экв/л</dd><dt>При Dmax</dt><dd>${fmt(C.alk.cmax)} мг-экв/л</dd><dt>Щёлочность исходной воды</dt><dd>${fmt(C.alk.water)} мг-экв/л</dd></dl>

V.ph=()=>`${stepsBar("ph")}
<h1>Коррекция pH</h1><p class="lead">Расход щёлочности коагулянтом и доза на целевой pH — разные величины. Точный расход кислоты или щёлочи по разности pH не рассчитывается.</p>
<div class="panel" style="margin-bottom:20px">${seg("ph.mode",[["none","Без коррекции"],["acid","Кислота"],["base","Щёлочь"],["unknown","Недостаточно данных"]])}</div>
${S.ph.mode==="acid"||S.ph.mode==="base"?`<div class="grid2"><div class="panel"><h2>${S.ph.mode==="acid"?"Кислота":"Щёлочь"}</h2>
 <div class="fields">${sel("ph.reag","Реагент",S.ph.mode==="acid"?[["HCl","HCl — соляная кислота"],["H2SO4","H₂SO₄ — серная кислота"]]:[["NaOH","NaOH — гидроксид натрия"]])}${txt("ph.point","Место ввода")}${num("ph.target","Целевой pH","")}</div>
 <div class="calc" style="margin-top:14px"><h3>Товарный и рабочий раствор</h3><div class="fields">${num("ph.w","Массовая доля вещества","% масс.",{req:1})}${num("ph.rho","Плотность товарного раствора","кг/л",{req:1})}${num("ph.wc","Рабочий раствор по 100 % вещества","г/л")}</div></div>
 <div class="calc" style="margin-top:14px"><h3>Способ определения дозы</h3>${seg("ph.how",[["manual","Заданная доза 100 %"],["curve","Титрационная зависимость"]])}
  ${S.ph.how==="manual"?`<div class="fields" style="margin-top:10px">${num("ph.d100","Доза 100 % вещества","мг/л",{req:1})}</div>`:
  `<p class="small muted" style="margin:10px 0 4px">Точки лабораторного титрования (ДЕМО): доза → pH. Интерполяция только внутри диапазона.</p><div class="tw"><table><thead><tr><th class="n">Доза, мг/л</th><th class="n">pH</th></tr></thead><tbody>${S.ph.curve.map((c,i)=>`<tr><td class="n"><input class="num" aria-label="доза ${i+1}" data-k="ph.curve.${i}.0" data-t="num" value="${String(c[0]).replace(".",",")}" style="width:90px;text-align:right;font-family:var(--f-mono)"></td><td class="n"><input class="num" aria-label="pH ${i+1}" data-k="ph.curve.${i}.1" data-t="num" value="${String(c[1]).replace(".",",")}" style="width:90px;text-align:right;font-family:var(--f-mono)"></td></tr>`).join("")}</tbody></table></div>`}</div></div>
 <div class="calc">${live("phout")}</div></div>`:
 `<div class="panel">${S.ph.mode==="none"?msgs([["info","Коррекция pH не предусмотрена. Насос P-102 и его точка ввода не включаются в P&ID."]]):msgs([["warn","Необходимость коррекции не определена. В результатах — статус «требуется уточнение»; на P&ID точка ввода показана как элемент, требующий уточнения."]])}</div>`}
${wizNav("ph")}`;
LIVE.phout=()=>{const p=C.ph;if(!p.ok)return `<h3>Расход реагента</h3>${msgs([["warn","Доза не определена. Нужна ручная доза 100 % вещества или целевой pH внутри титрационной кривой."]])}`;
 return `<h3>Расход · ${p.src==="curve"?'<span class="pill s-clarify">По титрованию (интерполяция)</span>':pill("user")}</h3><p class="mono">D₁₀₀ = ${fmt(p.d)} мг/л ${S.ph.reag}</p>
 <div class="tw"><table><thead><tr><th></th><th class="n">Q, м³/ч</th><th class="n">100 %, кг/ч</th><th class="n">Товарный, кг/ч</th><th class="n">Товарный, л/ч</th><th class="n">Рабочий, л/ч</th></tr></thead><tbody>
 ${p.qs.map(q=>`<tr><td>${QL[q.k]}</td><td class="n">${fmt(q.q)}</td><td class="n">${fmt(q.M100)}</td><td class="n">${fmt(q.Mc)}</td><td class="n">${fmt(q.Lc)}</td><td class="n">${fmt(q.Lw)}</td></tr>`).join("")}</tbody></table></div>
 <div class="formula">M₁₀₀ = D₁₀₀·Q/1000; Mком = M₁₀₀/w; qком = Mком/ρ; qраб = D₁₀₀·Q/C₁₀₀</div>`;};

V.contact=()=>`${stepsBar("contact")}
<h1>Смешение и контактные камеры</h1><p class="lead">Одна рабочая и одна резервная камера, каждая на полный расчётный расход (Р7). Объём не называется технологически достаточным, пока время не обосновано.</p>

 <div class="fields">${sel("mix.type","Тип быстрого смешения",[["Статический смеситель","Статический смеситель"],["Механический смеситель","Механический смеситель"],["Ввод в трубопровод","Ввод в трубопровод"]])}${txt("mix.seq","Последовательность ввода реагентов")}</div>
 <div style="margin:16px 0 10px">${seg("mix.calc",[["t2v","Время → минимальный объём"],["v2t","Объём → время"]])}</div>
 <div class="fields">${sel("mix.qBasis","Расход для подбора",[["max","Qmax (предложение)"],["nom","Qnom"],["min","Qmin"]],{hint:"Подбор выполняется по этому расходу"})}

 ${S.mix.calc==="t2v"?`<div class="fields" style="margin-top:12px">${txt("mix.tBasis","Основание контактного времени",{hint:"источник, опыт объекта, пилотные испытания"})}</div>`:""}

  ${S.mix.useK?`<div class="fields">${num("mix.k","k","—",{req:1})}${txt("mix.kBasis","Основание k",{req:1})}</div>`:""}</details></div>
 <div class="calc">${live("chout")}</div></div>${wizNav("contact")}`;
LIVE.chout=()=>{const c=C.ch;if(!isFinite(c.Ve))return `<h3>Камеры</h3>${msgs([["bad","Задайте контактное время или объём."]])}`;
 return `<h3>Камеры CT-101 (раб.) / CT-102 (рез.)</h3><dl class="kv"><dt>Расход подбора (${QL[S.mix.qBasis]})</dt><dd>${fmt(c.qd)} м³/ч</dd><dt>Vэфф, одна камера</dt><dd>${fmt(c.Ve)} м³</dd><dt>Vгеом, одна камера${c.k?" (k = "+fmt(c.k)+")":""}</dt><dd>${fmt(c.Vg)} м³</dd><dt>Vгеом, две камеры суммарно</dt><dd>${fmt(2*c.Vg)} м³</dd></dl>
 <div class="formula">${S.mix.calc==="t2v"?"Vэфф = Q·t/3600":"t = 3600·Vэфф/Q"}${c.k?"; Vгеом = Vэфф/k":""}</div>
 <h3 style="margin-top:14px">Номинальное время пребывания в рабочей камере</h3><div class="tw"><table><thead><tr><th></th><th class="n">Q, м³/ч</th><th class="n">t, с</th></tr></thead><tbody>${c.times.map(x=>`<tr><td>${QL[x.k]}</td><td class="n">${fmt(x.q)}</td><td class="n">${fmt(x.t)}</td></tr>`).join("")}</tbody></table></div>
 ${msgs(C.W.filter(w=>/Контактное время|k /.test(w[1])||/Коэффициент/.test(w[1])))}

V.pipe=()=>`${stepsBar("pipe")}
<h1>Трубопровод и насосы-дозаторы</h1><p class="lead">Труба: расчётный внутренний диаметр и скорости. Насосы: требуемые характеристики, а не выбор модели.</p>

 <div class="fields" style="margin-top:12px">${num("pipe.din","Факт. внутренний диаметр выбранного типоразмера","мм",{hint:"из каталога трубы; DN и Dнар здесь не вводятся"})}</div></div>
 <div class="panel"><h2>Насосы-дозаторы</h2><div class="fields">${num("pump.p","Давление в точке ввода","бар изб.",{req:1})}${num("pump.dp","Доп. потери давления","бар",{hint:"если заданы"})}${num("pump.margin","Проектный запас по подаче","%",{hint:"без значения по умолчанию (Р10)"})}${txt("pump.marginBasis","Основание запаса")}${sel("pump.reserve","Резервирование",[["1 раб. + 1 рез.","1 раб. + 1 рез. (предложение Р9)"],["без резерва","без резерва"],["складской резерв","складской резерв"]])}</div></div></div>

 <div class="formula">d = √(4·(Q/3600)/(π·v))</div>
 ${isNum(S.pipe.din)?`<div class="tw"><table><thead><tr><th></th><th class="n">Q, м³/ч</th><th class="n">v, м/с</th></tr></thead><tbody>${p.vs.map(x=>`<tr><td>${QL[x.k]}</td><td class="n">${fmt(x.q)}</td><td class="n">${fmt(x.v)}</td></tr>`).join("")}</tbody></table></div>`:msgs([["warn","Введите фактический dвн по каталогу, чтобы получить скорости при Qmin/Qnom/Qmax."]])}
 <h3 style="margin-top:16px">Насосы — требуемые характеристики</h3><div class="tw"><table><thead><tr><th>Позиция</th><th class="n">qmin, л/ч</th><th class="n">qnom, л/ч</th><th class="n">qmax, л/ч</th><th class="n">Верх диап., л/ч</th><th class="n">Кратн.</th><th class="n">P, бар</th></tr></thead><tbody>
 ${C.pumps.map(u=>`<tr><td><span class="tag">${u.tag}</span><div class="small muted">${u.name}</div></td><td class="n">${fmt(u.qmin)}</td><td class="n">${fmt(u.qnom)}</td><td class="n">${fmt(u.qmax)}</td><td class="n">${fmt(u.top)}</td><td class="n">${isFinite(u.turn)?"1:"+fmt(u.turn,2):"—"}</td><td class="n">≥ ${fmt(u.p)}</td></tr>`).join("")}</tbody></table></div>
 <p class="footnote">qmin = q(Dmin, Qmin), qmax = q(Dmax, Qmax), по рабочему раствору. ${S.Q.mode==="uf"?"Qmin — работа одной установки УФ: насос должен давать равномерный впрыск на этой подаче.":""} Давление = точка ввода + заданные потери; потери в линии не рассчитываются.</p>${msgs(C.W.filter(w=>/запас|типоразмер|рабочего раствора/.test(w[1])))}`;};

V.results=()=>{const R=REAG[S.r],P=S.pp[S.r];return `
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px"><div><div class="eyebrow">Расчёт RC-0001 · черновик · методики M-01…M-13 v1.0 · ДЕМО</div><h1>Результаты расчёта</h1></div><div>${pill(C.status)}</div></div>
<div class="grid2" style="margin-bottom:20px">
 <div class="panel"><h2>Коагулянт: ${R.label}</h2><p class="small muted" style="margin:0 0 8px">${esc(P.name)} · ${P.c?fmt(P.c)+" % по "+basisName(S.r,P.cb,P.hn):"концентрация не задана"} · ${C.dStatus==="user"?"доза задана пользователем":"доза не определена"}</p>
  <div class="tw"><table><thead><tr><th></th><th class="n">Qmin</th><th class="n">Qnom</th><th class="n">Qmax</th></tr></thead><tbody>
  <tr><td>Q, м³/ч</td>${C.flows.map(f=>`<td class="n">${fmt(f.q)}</td>`).join("")}</tr>

  ${S.r==="pacl"?`<tr><td>Доза <span class="basis">мг/л Al₂O₃</span></td>${C.flows.map(()=>`<td class="n">${fmt(C.dMe.nom/wMe("pacl","Al2O3"))}</td>`).join("")}</tr>`:""}
  <tr><td>Доза <span class="basis">мг/л товарного</span></td>${C.flows.map(f=>`<td class="n">${fmt(f.Dp)}</td>`).join("")}</tr>
  <tr><td>Расход ${R.me} (100 %), кг/ч</td>${C.flows.map(f=>`<td class="n">${fmt(f.Mme)}</td>`).join("")}</tr>
  ${S.r==="pacl"?`<tr><td>Расход Al₂O₃, кг/ч</td>${C.flows.map(f=>`<td class="n">${fmt(f.Mme/wMe("pacl","Al2O3"))}</td>`).join("")}</tr>`:`<tr><td>Расход ${R.salt.f} безв., кг/ч</td>${C.flows.map(f=>`<td class="n">${fmt(f.Mme/wMe(S.r,"salt"))}</td>`).join("")}</tr>`}
  <tr><td>Товарный продукт, кг/ч</td>${C.flows.map(f=>`<td class="n">${fmt(f.Mp)}</td>`).join("")}</tr>
  <tr><td>Товарный продукт, л/ч</td>${C.flows.map(f=>`<td class="n">${P.form==="solid"?"тв.":fmt(f.Lp)}</td>`).join("")}</tr>
  <tr><td>Рабочий раствор, л/ч</td>${C.flows.map(f=>`<td class="n">${fmt(f.Lw)}</td>`).join("")}</tr></tbody></table></div>
  <p class="footnote">Происхождение: ${pill("balance")} при дозе ${pill(C.dStatus)}</p></div>
 <div class="stack"><div class="panel"><h2>Оборудование</h2><dl class="kv">
  <dt>CT-101/102: Vэфф одной камеры</dt><dd>${fmt(C.ch.Ve)} м³</dd><dt>CT-101/102: Vгеом суммарно</dt><dd>${fmt(2*C.ch.Vg)} м³</dd>
  <dt>Трубопровод: dвн расчётный</dt><dd>${fmt(C.pipe.dCalc)} мм</dd><dt>Трубопровод: dвн выбранный</dt><dd>${isNum(S.pipe.din)?fmt(S.pipe.din)+" мм":"требует уточнения"}</dd>
  ${C.pumps.map(u=>`<dt>${u.tag}: подача</dt><dd>${fmt(u.qmin)}–${fmt(u.qmax)} л/ч</dd>`).join("")}
  <dt>Коррекция pH</dt><dd>${{none:"нет",acid:"кислота",base:"щёлочь",unknown:"не определена"}[S.ph.mode]}</dd></dl></div>
 <div class="panel"><h2>Требования к качеству</h2>${S.req.map(q=>`<div class="small" style="display:flex;justify-content:space-between;gap:8px;padding:3px 0"><span>${q.p} ≤ ${fmt(q.v)} ${q.u} · ${q.pt}</span><span class="pill s-clarify">не подтверждено</span></div>`).join("")}<div class="msg warn small">Требование задано. Достижение расчётом не подтверждено; требуется проверка.</div></div></div></div>

 <div class="panel"><h2>Допущения</h2><ul class="small" style="margin:0;padding-left:18px;display:grid;gap:4px">${C.ASM.map(a=>`<li>${a}</li>`).join("")}<li>Демо-значения: t = 60 с, v = 1,5 м/с — введены для примера, без основания.</li></ul></div></div>

function snap(){return {n:S.versions.length+1,date:new Date().toISOString().slice(0,10),st:JSON.parse(JSON.stringify({...S,versions:[],cmp:[]})),c:compute(S)};}
function saveVersion(toCmp){const v=snap();S.versions.push(v);S.selVersion=v.n;if(toCmp&&!S.cmp.includes(v.n))S.cmp.push(v.n);toast("Версия "+v.n+" сохранена");rerender();}

V.compare=()=>{const vs=S.versions.filter(v=>S.cmp.includes(v.n));return `
<h1>Сравнение вариантов</h1><p class="lead">Сравниваются расходы и оборудование при одинаковых исходных данных. Эффективность очистки не сравнивается.</p>
<div class="panel" style="margin-bottom:16px"><h3>Версии в сравнении</h3><div style="display:flex;flex-wrap:wrap;gap:12px">${S.versions.map(v=>`<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cmp${v.n}" ${S.cmp.includes(v.n)?"checked":""} onchange="toggleCmp(${v.n})"> в.${v.n} · ${REAG[v.st.r].short} · ${v.st.mode==="manual"?fmt(v.st.dose.nom)+" мг/л "+basisName(v.st.r,v.st.dose.basis,v.st.dose.hn):"оценка"}</label>`).join("")}</div>
 ${sameInputs(vs)?"":msgs([["warn","Исходные данные выбранных версий различаются — сравнение некорректно."]])}</div>
${vs.length<2?msgs([["info","Выберите не менее двух версий."]]):`<div class="panel tw"><table><thead><tr><th>Показатель</th>${vs.map(v=>`<th class="n">в.${v.n} · ${REAG[v.st.r].short}</th>`).join("")}</tr></thead><tbody>
 ${[["Степень окисления",v=>REAG[v.st.r].ox],["Доза Dnom, мг/л металла",v=>fmt(v.c.dMe.nom)+" "+REAG[v.st.r].me],["Доза товарного продукта, мг/л",v=>fmt(v.c.flows[1].Dp)],["Товарный продукт при Qnom, кг/ч",v=>fmt(v.c.flows[1].Mp)],["Товарный продукт при Qnom, л/ч",v=>v.st.pp[v.st.r].form==="solid"?"тв.":fmt(v.c.flows[1].Lp)],["Рабочий раствор при Qnom, л/ч",v=>fmt(v.c.flows[1].Lw)],["Расход щёлочности при Dnom, мг-экв/л",v=>fmt(v.c.alk.cons)],["Насос коагулянта, л/ч",v=>fmt(v.c.pumps[0].qmin)+"–"+fmt(v.c.pumps[0].qmax)],["Vэфф камеры, м³",v=>fmt(v.c.ch.Ve)],["Статус",v=>pill(v.c.status)]].map(([l,f])=>`<tr><td>${l}</td>${vs.map(v=>`<td class="n">${f(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
<p class="footnote">Вывод «реагент лучше очищает» по этой таблице не делается.</p>
<div class="btns"><button class="btn ghost" type="button" onclick="toast('Вариант отмечен как выбранный (имитация)')">Отметить выбранный вариант</button></div>`;};
function sameInputs(vs){if(vs.length<2)return true;const k=v=>JSON.stringify([v.c.Q,v.st.water]);return vs.every(v=>k(v)===k(vs[0]));}
function toggleCmp(n){const i=S.cmp.indexOf(n);if(i>=0)S.cmp.splice(i,1);else S.cmp.push(n);rerender();}

function cur(){return S.versions.find(v=>v.n===S.selVersion)||null;}

function equipModel(st,c){const E=[];const add=(tag,name,status,params)=>E.push({tag,name,status,params});
 add("F-100","Предфильтр исходной воды (до ввода реагентов)","conditional","тонкость фильтрации — по требованиям УФ");
 add("P-100","Насос подачи исходной воды (до ввода реагентов)","conditional","Q "+fmt(c.Q.min)+"–"+fmt(c.Q.max)+" м³/ч; напор — по расчёту УФ");
 add("FT-101","Расходомер исходной воды","conditional","сигнал для пропорционального дозирования; состав автоматики — на согласовании");
 if(st.ph.mode==="acid"||st.ph.mode==="base") { add("T-102","Ёмкость рабочего раствора "+st.ph.reag,"conditional","объём не рассчитывается в v1"); add("P-102A/B","Насос-дозатор "+st.ph.reag,c.ph.ok?"calculated":"clarify",c.ph.ok?`${fmt(c.pumps[1]?.qmin)}–${fmt(c.pumps[1]?.qmax)} л/ч, ≥ ${fmt(c.pumps[0].p)} бар`:"доза не определена"); }
 if(st.ph.mode==="unknown") add("IP-1","Точка ввода pH-реагента","clarify","необходимость не определена");
 add("T-101","Ёмкость рабочего раствора коагулянта","conditional","объём не рассчитывается в v1");
 add("P-101A/B","Насос-дозатор коагулянта ("+REAG[st.r].short+")",isFinite(c.pumps[0].qmax)?"calculated":"clarify",`${fmt(c.pumps[0].qmin)}–${fmt(c.pumps[0].qmax)} л/ч, ≥ ${fmt(c.pumps[0].p)} бар`);
 add("MX-101",st.mix.type,"conditional","тип выбран пользователем; не рассчитывается");
 add("AT-101","pH-метр после смешения","conditional","контроль; автоматика на согласовании");
 add("CT-101","Контактная камера рабочая",isFinite(c.ch.Ve)?"calculated":"clarify",`Vгеом ${fmt(c.ch.Vg)} м³`);
 add("CT-102","Контактная камера резервная",isFinite(c.ch.Ve)?"calculated":"clarify",`Vгеом ${fmt(c.ch.Vg)} м³`);
 add("XV-101…104","Отсечная арматура переключения камер","conditional","состав арматуры — на согласовании");
 add("L-101","Трубопровод узла",isNum(st.pipe.din)?"calculated":"clarify",isNum(st.pipe.din)?`dвн ${fmt(st.pipe.din)} мм, ${st.pipe.mat}`:`dвн расч. ${fmt(c.pipe.dCalc)} мм, типоразмер не выбран`);
 add("SP-1…3","Пробоотборные точки: исходная вода, перед УФ, (ультрафильтрат — вне узла)","conditional","");
 return E;}

 <g><rect x="440" y="236" width="70" height="28" rx="3" fill="var(--sheet)" stroke="${s["MX-101"][1]}" stroke-width="1.5" stroke-dasharray="${s["MX-101"][2]}"/><path d="M448 250 l8 -8 l8 16 l8 -16 l8 16 l8 -16 l8 8" fill="none" stroke="var(--ink2)"/><text x="475" y="284" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--ink)">MX-101</text></g>

V.note=()=>{const v=cur();if(!v)return `<h1>Пояснительная записка</h1>${msgs([["info","Сохраните версию расчёта."]])}`;
 const st=v.st,c=v.c,R=REAG[st.r],P=st.pp[st.r],E=equipModel(st,c);
 return `${versionPick()}<div class="grid2"><article class="panel note-doc"><div class="eyebrow">Расчёт RC-0001 в.${v.n} · ${v.date} · ${pill(c.status)}</div><h1 style="font-size:22px">Пояснительная записка: узел непосредственной коагуляции перед УФ</h1>
 <h3>1. Назначение</h3><p>Предварительный расчёт узла коагуляции перед ультрафильтрацией для объекта «${esc(st.project.customer)}». Документ не является рабочим проектом.</p>
 <h3>2. Исходные данные</h3><p>Расход ${fmt(c.Q.min)} / ${fmt(c.Q.nom)} / ${fmt(c.Q.max)} м³/ч. Анализ ${esc(st.water.id)} от ${st.water.date}: pH ${fmt(st.water.ph)}, щёлочность ${fmt(st.water.alk)} мг-экв/л, T ${fmt(st.water.T)} °C, мутность ${fmt(st.water.turb)} NTU, цветность ${fmt(st.water.color)} град., ПО ${fmt(st.water.po)} мг O₂/л.</p>
 <h3>3. Принятая схема</h3><p>Исходная вода → предфильтр F-100 → насос P-100 (оба до ввода реагентов, чтобы не разрушать хлопья и не забивать предфильтр коагулянтом) → ${st.ph.mode==="none"?"":"коррекция pH → "}ввод коагулянта ${R.short} → ${st.mix.type.toLowerCase()} → контактная камера CT-101 (резерв CT-102) → УФ.</p>
 <h3>4. Методика</h3><p>Материальные балансы M-01…M-07, M-09, M-11, M-12 (версия 1.0). Предварительная оценка доз не применялась. Расход щёлочности — стехиометрический баланс (M-06), не прогноз pH.</p>
 <h3>5. Дозы и расходы</h3><p>Продукт ${esc(P.name)}, ${fmt(P.c)} % по ${basisName(st.r,P.cb,P.hn)}. Доза ${fmt(c.dMe.min)}–${fmt(c.dMe.max)} мг/л ${R.me}, расчётная ${fmt(c.dMe.nom)} мг/л ${R.me} (задана пользователем). При Qnom: товарный продукт ${fmt(c.flows[1].Mp)} кг/ч${P.form==="liquid"?" ("+fmt(c.flows[1].Lp)+" л/ч)":""}, рабочий раствор ${fmt(c.flows[1].Lw)} л/ч.</p>
 <h3>6. Коррекция pH</h3><p>${{none:"Не предусмотрена.",unknown:"Необходимость не определена: недостаточно данных.",acid:"Кислота "+st.ph.reag+", доза "+fmt(c.ph.d)+" мг/л 100 % вещества.",base:"Щёлочь "+st.ph.reag+", доза "+fmt(c.ph.d)+" мг/л 100 % вещества."}[st.ph.mode]}</p>
