<title>Расчётные методики UF Depot</title>

<style>

  --bad:#ec8275; --bad-soft:#3b1d19; --demo:#b59ae6; --demo-soft:#2a2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --sheet:#162026; --ink:#e3eaee; --ink2:#9fb0ba; --line:#2b3a43; --soft:#1d2a31;
  --accent:#4fb3d0; --accent-soft:#16323c; --good:#6cc08f; --good-soft:#173226; --warn:#e2a54c; --warn-soft:#3a2b14;
  --bad:#ec8275; --bad-soft:#3b1d19; --demo:#b59ae6; --demo-soft:#2a2240; color-scheme:dark}

table{border-collapse:collapse;width:100%;font-size:13px}

.s-user{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}

.s-prelim{color:var(--demo);background:var(--demo-soft);border-color:var(--demo)}
.s-clarify{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.s-incomplete,.s-nodata{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.msg{border-left:3px solid;padding:8px 12px;border-radius:0 4px 4px 0;font-size:13px;margin:8px 0}

.msg.bad{border-color:var(--bad);background:var(--bad-soft)}

.msg.demo{border-color:var(--demo);background:var(--demo-soft)}

.tstage{border:1px solid var(--line);border-radius:6px;background:var(--sheet)}

.tstage>header h3{margin:0;font-size:14px}
.trow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,.8fr) auto;gap:6px 14px;padding:8px 14px;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.trow:last-child{border-bottom:0}
.trow .sub{font-family:var(--f-mono);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}

.ok{color:var(--good)} .fail{color:var(--bad)}
.ro input,.ro select,.ro textarea{background:var(--soft);pointer-events:none}

.dose{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--sheet)}
.dose .v{font:500 22px var(--f-mono)} .dose .l{font-size:12px;color:var(--ink2)}
.dose.acc{border-color:var(--accent);background:var(--accent-soft)}
</style>

<script>
"use strict";
/* =====================================================================
   ENGINE — расчётное ядро. Не зависит от UI, паспортов и справочников:
   получает всё через аргументы, возвращает результаты и протокол (trace).
   ===================================================================== */
const ENGINE_VERSION="0.1-proto";
const isNum=v=>typeof v==="number"&&isFinite(v);

/* --- безопасный разбор выражений (без eval): + − * / ^ ( ), min max sqrt ln exp abs --- */
const Expr=(()=>{
 const FN={min:Math.min,max:Math.max,sqrt:Math.sqrt,ln:Math.log,exp:Math.exp,abs:Math.abs};
 function tok(s){const t=[];let i=0;while(i<s.length){const c=s[i];
  if(/\s/.test(c)){i++;continue}
  if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.eE]/.test(s[j]))j++;t.push({t:"n",v:parseFloat(s.slice(i,j))});i=j;continue}
  if(/[A-Za-z_А-Яа-я]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z0-9_А-Яа-я]/.test(s[j]))j++;t.push({t:"id",v:s.slice(i,j)});i=j;continue}
  if("+-*/^(),".includes(c)){t.push({t:c});i++;continue}
  throw new Error("Недопустимый символ «"+c+"»");}return t;}
 function parse(s){const t=tok(s);let p=0;const peek=()=>t[p],eat=k=>{if(!t[p]||t[p].t!==k)throw new Error("Ожидалось «"+k+"»");return t[p++];};
  function E(){let n=T();while(peek()&&(peek().t==="+"||peek().t==="-")){const o=t[p++].t;n={o,a:n,b:T()};}return n;}
  function T(){let n=F();while(peek()&&(peek().t==="*"||peek().t==="/")){const o=t[p++].t;n={o,a:n,b:F()};}return n;}
  function F(){let n=U();if(peek()&&peek().t==="^"){p++;n={o:"^",a:n,b:F()};}return n;}
  function U(){if(peek()&&peek().t==="-"){p++;return {o:"neg",a:U()};}return P();}
  function P(){const k=peek();if(!k)throw new Error("Неожиданный конец выражения");
   if(k.t==="n"){p++;return {n:k.v};}
   if(k.t==="id"){p++;if(peek()&&peek().t==="("){p++;const args=[E()];while(peek()&&peek().t===","){p++;args.push(E());}eat(")");if(!FN[k.v])throw new Error("Неизвестная функция "+k.v);return {f:k.v,args};}return {v:k.v};}
   if(k.t==="("){p++;const n=E();eat(")");return n;}throw new Error("Неожиданный символ");}
  const ast=E();if(p<t.length)throw new Error("Лишние символы в конце");return ast;}
 function ev(n,vars){if("n" in n)return n.n;if("v" in n){if(!(n.v in vars))throw new Error("Не задана переменная "+n.v);return vars[n.v];}
  if(n.f)return FN[n.f](...n.args.map(a=>ev(a,vars)));const a=ev(n.a,vars);if(n.o==="neg")return -a;const b=ev(n.b,vars);
  return n.o==="+"?a+b:n.o==="-"?a-b:n.o==="*"?a*b:n.o==="/"?a/b:Math.pow(a,b);}
 function ids(n,acc=new Set()){if("v" in n)acc.add(n.v);if(n.a)ids(n.a,acc);if(n.b)ids(n.b,acc);if(n.args)n.args.forEach(x=>ids(x,acc));return acc;}
 function subst(s,vars,fmt){return tok(s).map(k=>k.t==="n"?fmt(k.v):k.t==="id"?(k.v in vars?fmt(vars[k.v]):k.v):k.t===","?", ":k.t==="*"?"·":` ${k.t} `.replace(/ ([()]) /,"$1")).join("").replace(/\s+/g," ").trim();}
 return {parse,ev,ids,subst};
})();

/* --- стехиометрия --- */
const A={H:1.008,O:15.999,S:32.06,Cl:35.45,Al:26.982,Fe:55.845};const H2O=2*A.H+A.O,SO4=A.S+4*A.O;
/* --- профили коагулянтов --- */
const PROFILES={
 PACl:{label:"ПОХА / PACl",me:"Al",ox:"Al(III)",salt:null,bases:["Al","Al2O3","product"],alk:{eqPerMol:3,useBasicity:true},checks:["основность и её определение для баланса щёлочности"]},
 "Al2(SO4)3":{label:"Al₂(SO₄)₃",me:"Al",ox:"Al(III)",salt:{M:2*A.Al+3*SO4,n:2,f:"Al₂(SO₄)₃"},bases:["Al","Al2O3","salt","hydrate","product"],alk:{eqPerMol:3},checks:["безводная соль или кристаллогидрат (n)"]},
 FeCl3:{label:"FeCl₃",me:"Fe",ox:"Fe(III)",salt:{M:A.Fe+3*A.Cl,n:1,f:"FeCl₃"},bases:["Fe","salt","hydrate","product"],alk:{eqPerMol:3},checks:["доля Fe²⁺ в продукте, если указана"]},
 "Fe2(SO4)3":{label:"Fe₂(SO₄)₃",me:"Fe",ox:"Fe(III)",salt:{M:2*A.Fe+3*SO4,n:2,f:"Fe₂(SO₄)₃"},bases:["Fe","salt","hydrate","product"],alk:{eqPerMol:3},checks:["доля Fe²⁺ в продукте, если указана"]},
 FeSO4:{label:"FeSO₄",me:"Fe",ox:"Fe(II)",salt:{M:A.Fe+SO4,n:1,f:"FeSO₄"},bases:["Fe","salt","hydrate","product"],alk:{eqPerMol:2,note:"Fe²⁺ → Fe(OH)₃ при окислении O₂"},checks:["независимый статус проверки окисления Fe²⁺"]}
};
function wMe(prof,basis,hn){const P=PROFILES[prof],me=P.me;
 if(basis===me)return 1; if(basis==="Al2O3")return 2*A.Al/(2*A.Al+3*A.O);
 if(basis==="salt")return P.salt.n*A[me]/P.salt.M; if(basis==="hydrate")return P.salt.n*A[me]/(P.salt.M+hn*H2O); return NaN;}
function basisLabel(prof,b,hn){const P=PROFILES[prof];return b===P.me?P.me:b==="Al2O3"?"Al₂O₃":b==="salt"?P.salt.f+" безв.":b==="hydrate"?P.salt.f+"·"+hn+"H₂O":"товарный продукт";}

/* --- STAGE 1: выбор дозы по методике --- */
function stageDose(m,inp,user,tr){
 const st={stage:1,title:"Выбор дозы",rows:[]};tr.push(st);const out={status:null,low:NaN,high:NaN,central:NaN,accepted:NaN,pump:NaN,pumpMin:NaN,basis:m.outputBasis,msgs:[]};
 st.rows.push(["Методика",`${m.id} · v${m.version} · ${m.modelType}`,(VSTAT[m.validationStatus]||[0,m.validationStatus])[1],"snapshot"]);
 if(m.modelType==="manual"){
  out.low=user.dMin;out.high=user.dMax;out.accepted=user.dNom;out.basis=user.basis;
  st.rows.push(["Диапазон (задан пользователем)",`Dmin…Dmax`,`${f(out.low)}…${f(out.high)} мг/л ${user.basisLabel}`,"user"]);
  st.rows.push(["Центральная оценка","методика её не задаёт","—","none"]);
 } else {
  // входы и область применимости
  const vars={};for(const v of m.inputVariables){const x=inp[v.name];
   if(!isNum(x)){out.status="nodata";st.rows.push([`Вход ${v.name}`,`${v.label}, ${v.unit}`,"нет данных","nodata"]);continue;}
   vars[v.name]=x;const L=m.applicabilityLimits.find(l=>l.var===v.name);const inside=L&&x>=L.min&&x<=L.max;
   st.rows.push([`Вход ${v.name}`,`${v.label} = ${f(x)} ${v.unit}; область ${L?f(L.min)+"…"+f(L.max):"не задана"}`,inside?"в области":"вне области",inside?"ok":"bad"]);
   if(!inside)out.status=out.status||"outside";}
  if(out.status){st.rows.push(["Итог",out.status==="nodata"?"Недостаточно данных для методики":"Вход вне области применимости","оценка не выдаётся","bad"]);return out;}
  if(m.modelType==="parameterizedExpression"){
   m.coefficients.forEach(c=>vars[c.name]=c.value);
   const D=Expr.ev(Expr.parse(m.expression),vars);out.central=D;
   st.rows.push(["Центральная оценка",`${m.expression} = ${Expr.subst(m.expression,vars,f)}`,`${f(D)} мг/л ${m.outputBasis}`,"prelim"]);
   const r=m.rangeRule;if(r.type==="relativeBand"){const lo=m.coefficients.find(c=>c.name===r.lower).value,hi=m.coefficients.find(c=>c.name===r.upper).value;
    out.low=D*(1-lo);out.high=D*(1+hi);
    st.rows.push(["Предварительный диапазон",`D·(1 − ${r.lower}) … D·(1 + ${r.upper}) = ${f(D)}·${f(1-lo)} … ${f(D)}·${f(1+hi)}`,`${f(out.low)}…${f(out.high)} мг/л ${m.outputBasis}`,"prelim"]);}
  } else if(m.modelType==="lookupTable"){
   const x=vars[m.lookup.key];const row=m.lookup.rows.find(r=>x>=r.from&&x<r.to);
   if(!row){out.status="outside";st.rows.push(["Таблица","строка не найдена","оценка не выдаётся","bad"]);return out;}
   out.low=row.low;out.high=row.high;
   st.rows.push(["Строка таблицы",`${m.lookup.key} = ${f(x)} ∈ [${f(row.from)}; ${f(row.to)})`,`${f(row.low)}…${f(row.high)} мг/л ${m.outputBasis}`,"prelim"]);
   st.rows.push(["Центральная оценка",m.rangeRule.central==="none"?"методика её не задаёт (правило диапазона: только границы)":"—","—","none"]);}
  out.accepted=isNum(user.accepted)?user.accepted:NaN;
 }
 // принятая доза
 if(!isNum(out.accepted)){out.status="incomplete";st.rows.push(["Принятая доза","не выбрана пользователем","—","bad"]);return out;}
 const inside=out.accepted>=out.low&&out.accepted<=out.high;
 st.rows.push(["Доза, принятая пользователем",inside?"внутри диапазона":"ВНЕ диапазона — предупреждение",`${f(out.accepted)} мг/л ${m.modelType==="manual"?user.basisLabel:m.outputBasis}`,inside?"user":"warn"]);
 if(!inside)out.msgs.push(["warn","Принятая доза вне предварительного диапазона методики."]);
 // доза для подбора насоса
 const auto=Math.max(out.high,out.accepted);out.pump=isNum(user.pumpOverride)&&user.pumpOverride>=out.accepted?user.pumpOverride:auto;out.pumpMin=Math.min(out.low,out.accepted);
 st.rows.push(["Доза для максимальной подачи насоса",isNum(user.pumpOverride)?`задана пользователем (основание: ${user.pumpBasis||"—"})`:`max(верх диапазона; принятая) = max(${f(out.high)}; ${f(out.accepted)})`,`${f(out.pump)} мг/л`,isNum(user.pumpOverride)?"user":"rule"]);
 st.rows.push(["Доза для минимальной подачи насоса",`min(низ диапазона; принятая) = min(${f(out.low)}; ${f(out.accepted)})`,`${f(out.pumpMin)} мг/л`,"rule"]);
 out.status=m.modelType==="manual"?"user":"prelim";return out;}

/* --- STAGE 2: конверсия базы --- */
function stageBasis(prof,dose,user,m,tr){const st={stage:2,title:"Конверсия базы дозирования",rows:[]};tr.push(st);const P=PROFILES[prof];
 const b=m.modelType==="manual"?user.basisKey:(m.outputBasis===P.me?P.me:m.outputBasis);const hn=user.hn;
 const w=wMe(prof,b,hn);const toMe=x=>x*w;
 st.rows.push(["Внутренняя база",`мг/л ${P.me}; входная база — ${basisLabel(prof,b,hn)}`,`w = ${f(w,4)}`,"balance"]);
 const r={low:toMe(dose.low),high:toMe(dose.high),central:toMe(dose.central),accepted:toMe(dose.accepted),pump:toMe(dose.pump),pumpMin:toMe(dose.pumpMin)};
 st.rows.push(["Принятая доза по металлу",`${f(dose.accepted)} × ${f(w,4)}`,`${f(r.accepted)} мг/л ${P.me}`,"balance"]);
 if(P.me==="Al"){const k=1/wMe(prof,"Al2O3");st.rows.push(["То же по Al₂O₃",`${f(r.accepted)} × ${f(k,4)}`,`${f(r.accepted*k)} мг/л Al₂O₃`,"balance"]);}
 if(P.salt){const k=1/wMe(prof,"salt");st.rows.push([`То же по ${P.salt.f} безв.`,`${f(r.accepted)} × ${f(k,4)}`,`${f(r.accepted*k)} мг/л`,"balance"]);}
 return r;}

/* --- STAGE 3: товарный и рабочий растворы --- */
function stageProduct(prof,dMe,pp,Q,tr){const st={stage:3,title:"Товарный и рабочий растворы",rows:[]};tr.push(st);const P=PROFILES[prof];
 const wP=pp.c/100*wMe(prof,pp.cb,pp.hn);st.rows.push(["Доля металла в товарном продукте",`${f(pp.c)} % по ${basisLabel(prof,pp.cb,pp.hn)} × w`,`${f(wP*100,4)} % ${P.me}`,"balance"]);
 const Dp=dMe.accepted/wP;st.rows.push(["Доза товарного продукта",`${f(dMe.accepted)} / ${f(wP,4)}`,`${f(Dp)} мг/л`,"balance"]);
 const Mp=Dp*Q.nom/1000;st.rows.push(["Товарный продукт при Qном",`${f(Dp)} × ${f(Q.nom)} / 1000`,`${f(Mp)} кг/ч`,"balance"]);
 let Lp=NaN;if(pp.form==="liquid"){Lp=Mp/pp.rho;st.rows.push(["То же, объём",`${f(Mp)} / ${f(pp.rho)} кг/л`,`${f(Lp)} л/ч`,"balance"]);}
 const cMe=pp.wc*wMe(prof,pp.wcb,pp.hn);st.rows.push(["Рабочий раствор по металлу",`${f(pp.wc)} г/л ${basisLabel(prof,pp.wcb,pp.hn)} × w`,`${f(cMe)} г/л ${P.me}`,"balance"]);
 const Lw=dMe.accepted*Q.nom/cMe;st.rows.push(["Рабочий раствор при Qном",`${f(dMe.accepted)} × ${f(Q.nom)} / ${f(cMe)} (одна база: ${P.me})`,`${f(Lw)} л/ч`,"balance"]);
 return {wP,Dp,Mp,Lp,cMe,Lw};}

/* --- STAGE 4: теоретический кислотно-основной баланс --- */
function stageAcidBase(prof,dMe,pp,water,tr){const st={stage:4,title:"Теоретический кислотно-основной баланс",rows:[]};tr.push(st);const P=PROFILES[prof];
 let f1=P.alk.eqPerMol/A[P.me];let txt=`${P.alk.eqPerMol} мг-экв/ммоль ÷ ${f(A[P.me],5)}`;
 if(P.alk.useBasicity){if(!isNum(pp.basicity)||!pp.bdef){st.rows.push(["Основность","не задана или без определения","баланс не выполняется","nodata"]);return {f:NaN};}
  f1*=1-pp.basicity/100;txt+=` × (1 − ${f(pp.basicity)} %)`;}
 st.rows.push(["Удельный расход щёлочности",txt+(P.alk.note?"; "+P.alk.note:""),`${f(f1,4)} мг-экв/мг ${P.me}`,"balance"]);
 const c=dMe.accepted*f1,cmax=dMe.pump*f1;
 st.rows.push(["При принятой дозе",`${f(dMe.accepted)} × ${f(f1,4)}`,`${f(c,3)} мг-экв/л`,"balance"]);
 st.rows.push(["При дозе подбора насоса",`${f(dMe.pump)} × ${f(f1,4)}`,`${f(cmax,3)} мг-экв/л`,"balance"]);
 st.rows.push(["Щёлочность исходной воды","из анализа",`${f(water.alk)} мг-экв/л`,"input"]);
 st.rows.push(["Теоретический остаток",`${f(water.alk)} − ${f(cmax,3)}`,`${f(water.alk-cmax,3)} мг-экв/л`,"balance"]);
 st.rows.push(["Ограничение","Баланс не прогнозирует pH и не является расчётом дозы кислоты/щёлочи","","note"]);
 if(!isNum(pp.freeAcid))st.rows.push(["Допущение","Свободная кислотность продукта не задана и не учтена","","note"]);
 return {f:f1,c,cmax,rest:water.alk-cmax};}

/* --- STAGE 5: коррекция pH --- */
function stagePH(ph,Q,tr){const st={stage:5,title:"Определение коррекции pH",rows:[]};tr.push(st);
 if(ph.mode==="none"){st.rows.push(["Решение","коррекция не предусмотрена (задано пользователем)","—","user"]);return {mode:"none"};}
 if(ph.mode==="unknown"){st.rows.push(["Решение","недостаточно данных для определения необходимости","—","nodata"]);return {mode:"unknown"};}
 if(!isNum(ph.d100)){st.rows.push(["Доза","нет ручной дозы и титрационной кривой — точный расход не рассчитывается","—","nodata"]);return {mode:ph.mode};}
 st.rows.push(["Доза 100 %","задана пользователем",`${f(ph.d100)} мг/л`,"user"]);return {mode:ph.mode,d:ph.d100};}

/* --- STAGE 6: расходы и оборудование --- */
function stageEquip(dMe,prod,Q,eq,tr){const st={stage:6,title:"Расходы и оборудование",rows:[]};tr.push(st);
 const qmin=dMe.pumpMin*Q.min/prod.cMe,qnom=dMe.accepted*Q.nom/prod.cMe,qmax=dMe.pump*Q.max/prod.cMe;
 st.rows.push(["Насос-дозатор: qmin",`D_min,насос × Qmin / C = ${f(dMe.pumpMin)} × ${f(Q.min)} / ${f(prod.cMe)}`,`${f(qmin)} л/ч`,"balance"]);
 st.rows.push(["Насос-дозатор: qном",`${f(dMe.accepted)} × ${f(Q.nom)} / ${f(prod.cMe)}`,`${f(qnom)} л/ч`,"balance"]);
 st.rows.push(["Насос-дозатор: qmax",`D_насос × Qmax / C = ${f(dMe.pump)} × ${f(Q.max)} / ${f(prod.cMe)}`,`${f(qmax)} л/ч`,"balance"]);
 st.rows.push(["Кратность регулирования",`qmax / qmin`,`1:${f(qmax/qmin,2)}`,"balance"]);
 const V=Q.max*eq.t/3600;st.rows.push(["Контактная камера, Vэфф",`Qmax × t / 3600 = ${f(Q.max)} × ${f(eq.t)} / 3600 (t — допущение пользователя)`,`${f(V)} м³ × 2 камеры`,"assume"]);
 st.rows.push(["Время при Qmin",`3600 × ${f(V)} / ${f(Q.min)}`,`${f(3600*V/Q.min)} с`,"balance"]);
 const d=Math.sqrt(4*(Q.max/3600)/(Math.PI*eq.v))*1000;st.rows.push(["Трубопровод, dвн расч.",`√(4·(${f(Q.max)}/3600)/(π·${f(eq.v)}))`,`${f(d)} мм`,"balance"]);
 return {qmin,qnom,qmax,V,d};}

/* --- FeSO4: независимая проверка окисления --- */
function stageFe2(prof,dMe,water,ox,tr){if(prof!=="FeSO4")return null;const st={stage:"Fe²⁺",title:"Проверка окисления Fe²⁺ (независимый статус)",rows:[]};tr.push(st);
 const need=dMe.pump*A.O*2/(4*A.Fe);
 st.rows.push(["Стехиометрическая потребность O₂",`${f(dMe.pump)} × 32 / (4 × ${f(A.Fe,5)})`,`${f(need,3)} мг/л`,"balance"]);
 st.rows.push(["Растворённый O₂",isNum(water.o2)?"из анализа":"нет данных",isNum(water.o2)?`${f(water.o2)} мг/л`:"—",isNum(water.o2)?"input":"nodata"]);
 if(isNum(water.o2))st.rows.push(["Стехиометрическая обеспеченность",water.o2>=need?"O₂ ≥ потребности":"O₂ < потребности",water.o2>=need?"обеспечено":"не обеспечено",water.o2>=need?"ok":"bad"]);
 st.rows.push(["Завершённость окисления за контактное время","Стехиометрическая обеспеченность не подтверждает завершения окисления",OXLABEL[ox.status],"ox"]);
 return {need,status:ox.status};}
const OXLABEL={unchecked:"не проверено",required:"требуется проверка",method:"подтверждено методикой",test:"подтверждено испытанием"};

/* --- общий запуск --- */
function run(c){const tr=[],W=[];let status;
 tr.push({stage:0,title:"Снимок входных данных",rows:[["Расчёт",`${c.id} · версия ${c.v} · ядро ${ENGINE_VERSION}`,c.created,"snapshot"],["Коагулянт",PROFILES[c.prof].label+" · "+PROFILES[c.prof].ox,c.pp.name,"snapshot"],["Расход",`Qmin / Qном / Qmax`,`${f(c.Q.min)} / ${f(c.Q.nom)} / ${f(c.Q.max)} м³/ч`,"input"],["Вода",`цветность ${f(c.water.color)} град., мутность ${f(c.water.turb)} NTU, T ${f(c.water.T)} °C, щёлочность ${f(c.water.alk)} мг-экв/л`,"анализ "+c.water.id,"input"]]});
 const dose=stageDose(c.method,c.water,c.user,tr);
 if(dose.status==="nodata"||dose.status==="outside"||dose.status==="incomplete")return {tr,dose,status:dose.status==="incomplete"?"incomplete":"nodata",W:[["bad",dose.status==="outside"?"Вход вне области применимости методики: оценка не выдаётся. Можно перейти к ручной дозе.":"Недостаточно данных: оценка не выдаётся."]]};
 W.push(...dose.msgs);
 const dMe=stageBasis(c.prof,dose,c.user,c.method,tr);const prod=stageProduct(c.prof,dMe,c.pp,c.Q,tr);
 const ab=stageAcidBase(c.prof,dMe,c.pp,c.water,tr);const ph=stagePH(c.ph,c.Q,tr);const eq=stageEquip(dMe,prod,c.Q,c.eq,tr);const fe=stageFe2(c.prof,dMe,c.water,c.ox,tr);
 tr.push({stage:"Q",title:"Требования к качеству",rows:c.req.map(r=>[r[0],`${r[1]} · ${r[2]}`,"Достижение расчётом не подтверждено; требуется проверка","note"])});
 if(c.method.validationStatus!=="published")W.push(["warn","Предварительная оценка выполнена по пользовательской методике без верификации."]);
 if(fe&&fe.status!=="method"&&fe.status!=="test")W.push(["bad","FeSO₄: завершённость окисления Fe²⁺ не подтверждена. Безусловная рекомендация не выдаётся."]);
 W.push(["warn","Контактное время задано пользователем без обоснования (ДЕМО)."]);
 status=dose.status==="user"?(W.some(w=>w[0]==="bad")?"clarify":"user"):"prelim";
 return {tr,dose,dMe,prod,ab,ph,eq,fe,status,W};}

/* формат */
function f(x,d){if(!isNum(x))return "—";const a=Math.abs(x);const dd=d??(a>=100?1:a>=10?2:a>=1?3:3);return Number(x.toFixed(dd)).toLocaleString("ru-RU",{maximumFractionDigits:dd});}

function makeCalc(id,prof,methodRef,user,extra={}){const m=clone(byRef(methodRef));

function draftErrors(d){const e=[];if(d.modelType==="manual")return e;
 if(!d.outputBasis)e.push("Не задана база результата (outputBasis).");
 d.inputVariables.forEach(v=>{if(!v.unit)e.push(`Переменная ${v.name}: нет единицы.`);if(!d.applicabilityLimits.find(l=>l.var===v.name&&isNum(l.min)&&isNum(l.max)))e.push(`Переменная ${v.name}: нет области применимости.`);});
 if(d.modelType==="parameterizedExpression"){try{const ast=Expr.parse(d.expression);const known=new Set([...d.inputVariables.map(v=>v.name),...d.coefficients.map(c=>c.name)]);[...Expr.ids(ast)].forEach(x=>{if(!known.has(x))e.push(`В выражении неизвестное имя «${x}».`);});}catch(err){e.push("Выражение: "+err.message);}
  d.coefficients.forEach(c=>{if(!isNum(c.value))e.push(`Коэффициент ${c.name}: нет значения.`);if(!c.unit)e.push(`Коэффициент ${c.name}: нет единицы.`);if(!c.basis)e.push(`Коэффициент ${c.name}: нет основания.`);});}
 if(!d.source)e.push("Не указан источник / основание методики.");
 return e;}
function testResults(d){return (d.testCases||[]).map(t=>{try{if(d.modelType==="parameterizedExpression"){const vars={...t.inputs};d.coefficients.forEach(c=>vars[c.name]=c.value);const got=Expr.ev(Expr.parse(d.expression),vars);return {t,got,pass:Math.abs(got-t.expect)<=t.tol};}
  const x=t.inputs[d.lookup.key];const r=d.lookup.rows.find(r=>x>=r.from&&x<r.to);return {t,got:r?`${f(r.low)}…${f(r.high)}`:"нет строки",pass:!!r&&r.low===t.expectLow&&r.high===t.expectHigh};}catch(e){return {t,got:"ошибка",pass:false};}});}

  <div class="btns">${has2?'<span class="pill s-balance">v2 сохранена</span><a class="btn ghost" href="#compare">К сравнению →</a>':`<button class="btn" type="button" onclick="saveChange()">Сохранить как v2 и создать новую версию расчёта</button>`}</div></div>
  <div class="panel"><h2>Что произойдёт</h2><ol class="small" style="padding-left:18px;display:grid;gap:6px;margin:0">
   <li>Создаётся запись USR-PACL-DEMO v2; v1 остаётся неизменной.</li><li>Контрольный пример color=35, turb=6 перестаёт совпадать с ожидаемым 2,85 — версия получает статус «личная, не верифицирована», пока пример не обновлён с основанием.</li>
   <li>Создаётся RC-0001 в.2 со снимком v2. Отчёт по в.1 остаётся как был.</li><li>Принятая пользователем доза не меняется автоматически: меняются диапазон и доза для подбора насоса.</li></ol></div></div>`;};
function chgBody(D1){const nb=UI.demoNew;const v={color:35,turb:6,a:0.5,b:nb,c:0.1};const D2=Expr.ev(Expr.parse("a + b*color + c*turb"),v);
 return `<div class="formula">v1: D = 0,5 + 0,05·35 + 0,1·6 = ${f(D1)} мг/л Al</div><div class="formula">v2: D = 0,5 + ${f(nb)}·35 + 0,1·6 = ${f(D2)} мг/л Al</div>
 <p class="small">Центральная оценка: ${f(D1)} → <b>${f(D2)}</b> мг/л Al (${D2>=D1?"+":""}${f(D2-D1)}).</p>`;}
function liveChange(){document.querySelectorAll('[data-live="chg"]').forEach(el=>el.innerHTML=chgBody(Expr.ev(Expr.parse("a + b*color + c*turb"),{a:0.5,b:0.05,c:0.1,color:35,turb:6})));}
function saveChange(){UI.draft=clone(latest("USR-PACL-DEMO"));UI.draft.coefficients.find(c=>c.name==="b").value=UI.demoNew;UI.draft.coefficients.find(c=>c.name==="b").basis="ДЕМО: уточнено пользователем";
 const d=saveDraft(`b: 0,05 → ${f(UI.demoNew)} (ДЕМО)`);makeCalc("RC-0001","PACl",d.id+"@"+d.version,UPACL,{note:"Новая версия после изменения b",created:NOW+" 20:"+String(30+CALCS.length)});
 UI.cmpB="RC-0001@"+CALCS.filter(c=>c.id==="RC-0001").length;UI.tab="compare";location.hash="compare";render();}

/* --- 4. До и после --- */
const calcRef=r=>{const[id,v]=r.split("@");return CALCS.find(c=>c.id===id&&c.v===+v);};
V.compare=()=>{const refs=CALCS.filter(c=>c.id==="RC-0001").map(c=>c.id+"@"+c.v);if(!UI.cmpB&&refs.length>1)UI.cmpB=refs[refs.length-1];
 if(refs.length<2)return `<h1>Сравнение до и после</h1><div class="msg info">Пока есть только RC-0001 в.1. Измените коэффициент на экране 3 — появится в.2 для сравнения.</div><a class="btn" href="#change">Перейти к изменению коэффициента</a>`;
 const a=calcRef(UI.cmpA),b=calcRef(UI.cmpB);const ra=a.result,rb=b.result;
 const row=(l,x,y,u,good)=>{const d=y-x;const cls=Math.abs(d)<1e-9?"diff-eq":"";return `<tr><td>${l}</td><td class="n">${f(x)}</td><td class="n">${f(y)}</td><td class="n ${cls}">${Math.abs(d)<1e-9?"=":(d>0?"+":"")+f(d)}</td><td class="small muted">${u}</td></tr>`;};
 return `<h1>Сравнение до и после</h1><p class="lead">Одинаковые исходные данные и паспорт; различается только версия методики.</p>
 <div class="panel" style="margin-bottom:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center"><span class="small">До:</span><b class="mono">${UI.cmpA} · ${a.methodRef}</b><span class="small">После:</span><select id="cmpB" onchange="UI.cmpB=this.value;render()">${refs.filter(r=>r!==UI.cmpA).map(r=>`<option${r===UI.cmpB?" selected":""}>${r}</option>`).join("")}</select><b class="mono">${b.methodRef}</b></div>
 <div class="grid2"><div class="panel tw"><table><thead><tr><th>Показатель</th><th class="n">До</th><th class="n">После</th><th class="n">Δ</th><th>Ед.</th></tr></thead><tbody>
 ${row("Предварительный диапазон: низ",ra.dose.low,rb.dose.low,"мг/л Al")}${row("Предварительный диапазон: верх",ra.dose.high,rb.dose.high,"мг/л Al")}${row("Центральная оценка",ra.dose.central,rb.dose.central,"мг/л Al")}${row("Доза, принятая пользователем",ra.dose.accepted,rb.dose.accepted,"мг/л Al")}${row("Доза для макс. подачи насоса",ra.dose.pump,rb.dose.pump,"мг/л Al")}
 ${row("Товарный ПОХА при Qном",ra.prod.Mp,rb.prod.Mp,"кг/ч")}${row("Насос: qmin",ra.eq.qmin,rb.eq.qmin,"л/ч")}${row("Насос: qmax",ra.eq.qmax,rb.eq.qmax,"л/ч")}${row("Кратность регулирования",ra.eq.qmax/ra.eq.qmin,rb.eq.qmax/rb.eq.qmin,"1:x")}${row("Расход щёлочности при дозе насоса",ra.ab.cmax,rb.ab.cmax,"мг-экв/л")}</tbody></table></div>
 <div class="panel"><h2>Вывод</h2><ul class="small" style="padding-left:18px;display:grid;gap:6px;margin:0"><li>Принятая доза ${f(rb.dose.accepted)} мг/л Al не изменилась — её меняет только пользователь.</li><li>Расход товарного продукта при Qном не изменился, так как он считается по принятой дозе.</li><li>Диапазон сузился вместе с центральной оценкой; доза подбора насоса снизилась с ${f(ra.dose.pump)} до ${f(rb.dose.pump)} мг/л Al, верх подачи насоса — с ${f(ra.eq.qmax)} до ${f(rb.eq.qmax)} л/ч.</li><li>Статус методики v2: ${VSTAT[b.method.validationStatus][1].toLowerCase()}.</li></ul>
 <div class="msg warn small">Сравнение показывает влияние коэффициента на расход и оборудование. Оно не говорит, какая версия ближе к реальной оптимальной дозе.</div></div></div>`;};

/* --- 5. История --- */
V.history=()=>{const ms=REG.filter(m=>m.scope==="personal"||m.id.startsWith("USR")).sort((a,b)=>a.id.localeCompare(b.id)||a.version-b.version);
 return `<h1>История версий</h1><p class="lead">Методики и расчёты — неизменяемые записи. Новая версия появляется только при явном сохранении.</p>
 <div class="panel" style="margin-bottom:20px"><h2>Методики (личные)</h2><div class="tw"><table><thead><tr><th>Методика</th><th class="n">Версия</th><th>Создана</th><th>Автор</th><th>Изменение</th><th>Основа</th><th>Статус</th></tr></thead><tbody>${ms.map(m=>`<tr><td class="mono">${m.id}</td><td class="n">v${m.version}</td><td class="mono small">${m.createdAt}</td><td class="small">${esc(m.author)}</td><td class="small">${esc(m.changeNote||m.note)}</td><td class="mono small">${m.version>1?"v"+(m.version-1):m.parent||"—"}</td><td>${vpill(m.validationStatus)}</td></tr>`).join("")}</tbody></table></div></div>
 <div class="panel"><h2>Расчёты</h2><div class="tw"><table><thead><tr><th>Расчёт</th><th>Создан</th><th>Методика (снимок)</th><th class="n">Принятая доза</th><th class="n">Насос, л/ч</th><th>Статус</th><th>Отчёт</th></tr></thead><tbody>${CALCS.map(c=>{const newer=c.method.modelType!=="manual"&&latest(c.method.id).version>c.method.version;return `<tr><td class="mono">${c.id} в.${c.v}</td><td class="mono small">${c.created}</td><td class="mono small">${c.methodRef}</td><td class="n">${f(c.result.dose.accepted)}</td><td class="n">${f(c.result.eq?.qmin)}–${f(c.result.eq?.qmax)}</td><td>${spill(c.result.status)}</td><td class="small">${newer?'<span class="pill s-clarify">есть новая версия методики</span> отчёт не пересчитан':"актуален для своей версии"}</td></tr>`;}).join("")}</tbody></table></div>
 <p class="footnote">Автоматический пересчёт старых отчётов не выполняется. Чтобы применить новую версию методики, создайте новую версию расчёта.</p>
 <div class="btns"><button class="btn ghost" type="button" onclick="recalcLatest()">Создать новую версию RC-0001 на последней версии методики</button></div></div>`;};
function recalcLatest(){const m=latest("USR-PACL-DEMO");makeCalc("RC-0001","PACl",m.id+"@"+m.version,UPACL,{note:"Пересчёт по запросу",created:NOW+" 20:"+String(40+CALCS.length)});toast("Создана новая версия RC-0001");render();}

/* --- 6. Протокол --- */
const ORIG={snapshot:["s-user","снимок"],input:["s-user","исходные данные"],user:["s-user","задано пользователем"],prelim:["s-prelim","предварительная оценка"],balance:["s-balance","материальный баланс"],rule:["s-balance","правило"],assume:["s-clarify","допущение"],warn:["s-clarify","предупреждение"],ok:["s-balance","проверка ✓"],bad:["s-nodata","не выполнено"],nodata:["s-nodata","нет данных"],none:["s-user","не задаётся"],note:["s-clarify","ограничение"],ox:["s-clarify","статус окисления"]};
V.protocol=()=>{const refs=CALCS.map(c=>c.id+"@"+c.v);const c=calcRef(UI.protoCalc)||CALCS[0];const r=c.result;const d=r.dose;
 return `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end"><div><div class="eyebrow">Протокол расчёта · ${c.id} в.${c.v} · ${c.created}</div><h1>Пошаговый протокол</h1></div><div style="display:flex;gap:10px;align-items:center"><select id="pc" aria-label="Расчёт" onchange="UI.protoCalc=this.value;render()">${refs.map(x=>`<option${x===UI.protoCalc?" selected":""}>${x}</option>`).join("")}</select>${spill(r.status)}</div></div>
 <p class="lead">Каждая строка: что вычислено, подстановка чисел, результат и происхождение. Протокол формируется ядром и сохраняется в версии расчёта вместе со снимком методики.</p>
 ${d&&isNum(d.accepted)?`<div class="dosegrid" style="margin-bottom:18px"><div class="dose"><div class="l">Предварительный диапазон</div><div class="v">${c.method.modelType==="manual"?"—":f(d.low)+"…"+f(d.high)}</div><div class="l">${c.method.modelType==="manual"?"методика не применялась":"мг/л "+c.method.outputBasis}</div></div><div class="dose"><div class="l">Центральная оценка</div><div class="v">${f(d.central)}</div><div class="l">${isNum(d.central)?"мг/л "+c.method.outputBasis:"методика не задаёт"}</div></div><div class="dose acc"><div class="l">Доза, принятая пользователем</div><div class="v">${f(d.accepted)}</div><div class="l">мг/л ${c.method.modelType==="manual"?c.user.basisLabel:c.method.outputBasis}</div></div><div class="dose"><div class="l">Доза для макс. подачи насоса</div><div class="v">${f(d.pump)}</div><div class="l">мг/л · ${isNum(c.user.pumpOverride)?"задана пользователем":"по правилу"}</div></div></div>`:""}
 <div class="trace">${r.tr.map(s=>`<section class="tstage"><header><b>${typeof s.stage==="number"?(s.stage===0?"ВХОД":"ЭТАП "+s.stage):s.stage==="Q"?"КАЧЕСТВО":"FeSO₄"}</b><h3>${s.title}</h3></header>${s.rows.map(x=>`<div class="trow"><div>${x[0]}</div><div class="sub">${x[1]}</div><div class="res">${x[2]}</div><div>${ORIG[x[3]]?pill(ORIG[x[3]][0],ORIG[x[3]][1]):""}</div></div>`).join("")}</section>`).join("")}</div>
 <div class="grid2" style="margin-top:18px"><div class="panel"><h2>Предупреждения</h2>${r.W.map(w=>`<div class="msg ${w[0]} small">${w[1]}</div>`).join("")}</div><div class="panel"><h2>Допущения (снимок)</h2><ul class="small" style="padding-left:18px;margin:0">${c.assumptions.map(a=>`<li>${a}</li>`).join("")}</ul><p class="footnote">Методика: ${c.methodRef}${c.method.coefficients.length?" · коэффициенты: "+c.method.coefficients.map(k=>k.name+"="+f(k.value)).join(", "):""}</p></div></div>`;};

/* --- 7. Требуют подтверждения --- */
V.sources=()=>`<h1>Методики, требующие подтверждения источниками</h1><p class="lead">До получения источника каждая из них либо отсутствует в общем реестре, либо существует только как шаблон без коэффициентов. Ручная доза и материальные балансы работают без них.</p>
<div class="panel tw"><table><thead><tr><th>Код</th><th>Методика</th><th>Профиль</th><th>Тип модели</th><th>Что нужно</th><th>Без неё в v1</th></tr></thead><tbody>
${[["M-14","Предварительный диапазон доз","PACl","expression / lookup","Источник, входы (напр. цветность, ПО, мутность, T), единицы, область, контрольные примеры","Ручная доза; оценка — «недостаточно данных»"],
["M-15a","Предварительный диапазон доз","FeCl₃","expression / lookup","То же; перенос зависимости для Al запрещён","То же"],
["M-15b","Предварительный диапазон доз","Fe₂(SO₄)₃","expression / lookup","То же","То же"],
["M-16","Предварительный диапазон доз","Al₂(SO₄)₃","expression / lookup","То же; связь с базой гидрата","То же"],
["M-16b","Предварительный диапазон доз","FeSO₄","expression / lookup","То же + условия окисления","То же"],
["M-17","Завершённость окисления Fe²⁺ за контактное время","FeSO₄","lookup / протокол испытаний","Проверенная кинетическая зависимость или результаты испытаний (pH, T, O₂/окислитель, t)","Статус «требуется проверка»; стехиометрия O₂ показывается, но не подтверждает окисление"],
["M-08","Доза кислоты/щёлочи до целевого pH","HCl, H₂SO₄, NaOH","lookup (титрование)","Экспериментальная титрационная кривая воды объекта или проверенная равновесная модель","Ручная доза 100 % вещества"],
["M-06+","Учёт свободной кислотности и основности в балансе","PACl и др.","parameterizedExpression","Определение основности производителя, единицы свободной кислотности","Баланс без свободной кислотности, с пометкой"],
["M-09","Контактное время","все","параметр с основанием","Источник или опыт объекта / пилотные испытания","Время задаёт пользователь; объём не называется достаточным"],
["M-10","Коэффициент использования объёма k","все","параметр с основанием","Источник или гидродинамика камеры","k не применяется"],
["M-11v","Расчётная скорость в трубопроводе","все","параметр с основанием","Норматив или практика заказчика","Скорость задаёт пользователь"],
["M-12z","Проектный запас подачи насоса","все","параметр с основанием","Стандарт заказчика","Запас задаёт пользователь"],
["M-18","Прогноз SDI15, остаточного металла, ПО ультрафильтрата","все","—","Проверенная модель или пилотные данные","Только заданные требования: «достижение не подтверждено»"],
["M-19","Нагрузка на УФ по ВВ и осадку","все","—","Модель осадка без двойного учёта, эксперимент","Только модель данных"]].map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="small">${r[3]}</td><td class="small">${r[4]}</td><td class="small">${r[5]}</td></tr>`).join("")}</tbody></table></div>`;

/* роутинг */
function render(){const tabs=`<nav class="tabs" aria-label="Разделы">${TABS.map(([k,n,l])=>`<a href="#${k}"${k===UI.tab?' aria-current="page"':""}><span class="n">${n}</span>${l}</a>`).join("")}</nav>`;
 document.getElementById("main").innerHTML=tabs+(V[UI.tab]||V.arch)();}
function route(){const h=location.hash.slice(1);UI.tab=V[h]?h:"arch";render();window.scrollTo(0,0);}
function toast(m){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:4px;font-size:13px;z-index:9";document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2400);}
window.addEventListener("hashchange",route);route();
</script>
